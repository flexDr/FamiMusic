<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>FamiMusic — Apple Music Style</title>
    <style>
        /* ========== ESTILOS GLOBALES ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
            background: #0a0a0f;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* AURA ANIMADA */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(255, 106, 136, 0.3), transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(255, 179, 71, 0.3), transparent 50%),
                        radial-gradient(circle at 40% 20%, rgba(138, 43, 226, 0.2), transparent 50%);
            background-blend-mode: overlay;
            animation: auraMove 12s ease infinite alternate;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes auraMove {
            0% { background-position: 0% 0%; filter: hue-rotate(0deg) blur(40px); }
            50% { background-position: 100% 50%; filter: hue-rotate(15deg) blur(50px); }
            100% { background-position: 50% 100%; filter: hue-rotate(-10deg) blur(45px); }
        }

        .app {
            display: flex;
            height: 100%;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(2px);
        }

        /* ========== SIDEBAR (escritorio) ========== */
        .sidebar {
            width: 280px;
            background: rgba(18, 18, 28, 0.7);
            backdrop-filter: blur(20px);
            padding: 28px 20px;
            border-right: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            gap: 32px;
            z-index: 2;
            transition: transform 0.3s ease;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #ff6a88, #ffb347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .nav-links, .playlists ul {
            list-style: none;
        }

        .nav-links a, .playlists li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            color: #ddd;
            text-decoration: none;
            font-size: 1rem;
            transition: 0.2s;
            cursor: pointer;
        }

        .nav-links a.active, .nav-links a:hover, .playlists li:hover {
            color: #ff6a88;
        }

        .search-box input {
            width: 100%;
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 12px 16px;
            border-radius: 30px;
            color: white;
            font-size: 0.9rem;
            outline: none;
        }

        .playlists { margin-top: auto; }
        .section-title { font-size: 0.8rem; text-transform: uppercase; color: #aaa; margin-bottom: 12px; }

        /* ========== CONTENIDO PRINCIPAL ========== */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 40px 32px;
            scroll-behavior: smooth;
        }

        .hero h1 {
            font-size: 2.8rem;
            background: linear-gradient(120deg, #fff, #ffb347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            margin: 32px 0 20px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 24px;
        }

        .music-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 12px;
            transition: transform 0.3s, background 0.2s;
            cursor: pointer;
        }

        .music-card:hover {
            background: rgba(255,255,255,0.12);
            transform: translateY(-6px);
        }

        .card-img {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
        }

        .card-img img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 12px;
        }

        .play-btn-overlay {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: #ff3b30;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .music-card:hover .play-btn-overlay { opacity: 1; }

        /* ========== REPRODUCTOR MODERNO (BARRA INFERIOR) ========== */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(30, 30, 40, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 12px 24px;
            display: flex;
            flex-direction: column;
            z-index: 100;
            transform: translateY(0);
            transition: transform 0.3s;
        }

        .player-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .player-info img { border-radius: 8px; }

        .track-details { line-height: 1.3; }
        .track-title { font-weight: 500; font-size: 0.9rem; }
        .track-artist { font-size: 0.7rem; color: #aaa; }

        .player-controls-center {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .player-controls-center button, .video-toggle-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .player-controls-center button:hover, .video-toggle-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            margin-top: 6px;
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }

        .progress-filled {
            width: 0%;
            height: 100%;
            background: #ff3b30;
            border-radius: 4px;
            position: relative;
        }

        .time {
            font-size: 0.7rem;
            color: #aaa;
            min-width: 70px;
            text-align: center;
        }

        /* Contenedor de video (opcional) */
        .video-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 800px;
            background: black;
            border-radius: 20px;
            overflow: hidden;
            z-index: 200;
            display: none;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        .video-container iframe { width: 100%; height: 400px; border: none; }
        .close-video {
            position: absolute;
            top: 10px;
            right: 20px;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 201;
        }

        /* ========== MENÚ INFERIOR PARA MÓVIL (TAB BAR) ========== */
        .mobile-tab-bar {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(18, 18, 28, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 10px 20px;
            justify-content: space-around;
            z-index: 101;
        }
        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #aaa;
            cursor: pointer;
            transition: color 0.2s;
        }
        .tab-item.active, .tab-item:hover { color: #ff6a88; }
        .tab-item svg { width: 24px; height: 24px; fill: currentColor; }
        .tab-label { font-size: 0.7rem; }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .mobile-tab-bar { display: flex; }
            .main-content { padding: 20px 16px; margin-bottom: 70px; }
            .player-bar { margin-bottom: 60px; }
            .cards-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; }
        }

        /* Scrollbar */
        .main-content::-webkit-scrollbar { width: 6px; }
        .main-content::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
        .main-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }
    </style>
</head>
<body>
<div class="app">
    <!-- Sidebar desktop -->
    <aside class="sidebar">
        <div class="logo">🎵 FamiMusic</div>
        <nav class="nav-links">
            <a href="#" data-section="home" class="active">🏠 Para Ti</a>
            <a href="#" data-section="explore">🔍 Explorar</a>
            <a href="#" data-section="radio">📻 Radio</a>
        </nav>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar canciones...">
        </div>
        <div class="playlists">
            <div class="section-title">Tus listas</div>
            <ul>
                <li data-playlist="favorites">❤️ Favoritos</li>
                <li data-playlist="mix">🎧 Mezcla diaria</li>
                <li data-playlist="driving">🚗 Conducción</li>
            </ul>
        </div>
    </aside>

    <!-- Main content -->
    <main class="main-content" id="mainContent"></main>

    <!-- Reproductor moderno -->
    <div class="player-bar" id="playerBar" style="display: none;">
        <div class="player-top">
            <div class="player-info">
                <img id="currentThumb" width="48" height="48" style="border-radius: 8px;">
                <div class="track-details">
                    <div id="currentTitle" class="track-title"></div>
                    <div class="track-artist">FamiMusic</div>
                </div>
            </div>
            <div class="player-controls-center">
                <button id="prevBtn" title="Anterior">⏮️</button>
                <button id="playPauseBtn" style="font-size: 2rem;">▶️</button>
                <button id="nextBtn" title="Siguiente">⏭️</button>
                <button id="videoToggleBtn" class="video-toggle-btn" title="Ver video">📺</button>
            </div>
        </div>
        <div class="progress-container">
            <span class="time" id="currentTime">0:00</span>
            <div class="progress-bar" id="progressBar">
                <div class="progress-filled" id="progressFilled"></div>
            </div>
            <span class="time" id="duration">0:00</span>
        </div>
        <div id="youtube-player" style="position: absolute; bottom: 0; left: 0; opacity: 0; pointer-events: none;"></div>
    </div>

    <!-- Modal de video -->
    <div class="video-container" id="videoModal">
        <span class="close-video" id="closeVideo">✕</span>
        <iframe id="videoIframe" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <!-- Menú inferior para móvil -->
    <div class="mobile-tab-bar" id="mobileTabBar">
        <div class="tab-item active" data-section="home">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-6 9 6v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span class="tab-label">Inicio</span>
        </div>
        <div class="tab-item" data-section="explore">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
            <span class="tab-label">Explorar</span>
        </div>
        <div class="tab-item" data-section="radio">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M12 2a10 10 0 0 0-10 10 10 10 0 0 0 10 10 10 10 0 0 0 10-10 10 10 0 0 0-10-10z"/><path d="M12 6a6 6 0 0 0-6 6 6 6 0 0 0 6 6 6 6 0 0 0 6-6 6 6 0 0 0-6-6z"/></svg>
            <span class="tab-label">Radio</span>
        </div>
        <div class="tab-item" data-playlist="favorites">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            <span class="tab-label">Favoritos</span>
        </div>
    </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
    // ========== GLOBALES ==========
    let player;
    let currentQueue = [];      // Lista de canciones actual
    let currentIndex = 0;
    let isPlaying = false;
    let currentSongData = null;
    let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
    let updateInterval = null;

    // Elementos DOM
    const playerBar = document.getElementById('playerBar');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressBar = document.getElementById('progressBar');
    const progressFilled = document.getElementById('progressFilled');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('duration');
    const videoModal = document.getElementById('videoModal');
    const videoIframe = document.getElementById('videoIframe');
    const closeVideo = document.getElementById('closeVideo');
    const videoToggleBtn = document.getElementById('videoToggleBtn');

    // ========== INICIALIZAR PLAYER ==========
    function onYouTubeIframeAPIReady() {
        player = new YT.Player('youtube-player', {
            height: '0', width: '0',
            playerVars: { autoplay: 0, controls: 0, modestbranding: 1, rel: 0, enablejsapi: 1, mute: 1 },
            events: {
                onReady: () => console.log("Player listo"),
                onStateChange: onPlayerStateChange,
                onError: (e) => console.error("Error en reproductor", e)
            }
        });
    }

    function onPlayerStateChange(event) {
        if (event.data === YT.PlayerState.PLAYING) {
            isPlaying = true;
            playPauseBtn.innerHTML = '⏸️';
            startProgressUpdate();
        } else if (event.data === YT.PlayerState.PAUSED) {
            isPlaying = false;
            playPauseBtn.innerHTML = '▶️';
            stopProgressUpdate();
        } else if (event.data === YT.PlayerState.ENDED) {
            // Siguiente canción automática
            nextSong();
        }
    }

    function startProgressUpdate() {
        if (updateInterval) clearInterval(updateInterval);
        updateInterval = setInterval(() => {
            if (player && player.getCurrentTime && isPlaying) {
                const current = player.getCurrentTime();
                const duration = player.getDuration();
                if (duration) {
                    const percent = (current / duration) * 100;
                    progressFilled.style.width = `${percent}%`;
                    currentTimeSpan.textContent = formatTime(current);
                    durationSpan.textContent = formatTime(duration);
                }
            }
        }, 500);
    }

    function stopProgressUpdate() {
        if (updateInterval) clearInterval(updateInterval);
    }

    function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // ========== REPRODUCIR CANCIÓN (añadir a cola) ==========
    function playSong(videoId, title, thumb, addToQueue = true, replaceQueue = false) {
        if (!player) return;
        if (replaceQueue) {
            currentQueue = [{ id: videoId, title, thumb }];
            currentIndex = 0;
        } else if (addToQueue) {
            // Buscar si ya está en cola
            const existing = currentQueue.findIndex(s => s.id === videoId);
            if (existing !== -1) currentIndex = existing;
            else {
                currentQueue.push({ id: videoId, title, thumb });
                currentIndex = currentQueue.length - 1;
            }
        } else {
            // Solo cambiar la actual sin modificar cola
            currentSongData = { id: videoId, title, thumb };
        }
        if (currentQueue.length) currentSongData = currentQueue[currentIndex];
        // Actualizar UI del reproductor
        playerBar.style.display = 'flex';
        document.getElementById('currentTitle').innerHTML = currentSongData.title;
        document.getElementById('currentThumb').src = currentSongData.thumb;
        player.loadVideoById({ videoId: currentSongData.id, startSeconds: 0 });
        player.unMute(); // Sonido automático tras clic
        // Si hay modal de video abierto, actualizar también
        if (videoModal.style.display === 'flex') updateVideoModal();
    }

    function nextSong() {
        if (currentQueue.length === 0) return;
        currentIndex = (currentIndex + 1) % currentQueue.length;
        const next = currentQueue[currentIndex];
        playSong(next.id, next.title, next.thumb, false);
    }

    function prevSong() {
        if (currentQueue.length === 0) return;
        currentIndex = (currentIndex - 1 + currentQueue.length) % currentQueue.length;
        const prev = currentQueue[currentIndex];
        playSong(prev.id, prev.title, prev.thumb, false);
    }

    // ========== VIDEO MODAL ==========
    function updateVideoModal() {
        if (currentSongData) {
            videoIframe.src = `https://www.youtube.com/embed/${currentSongData.id}?autoplay=1&enablejsapi=1`;
        }
    }
    videoToggleBtn.addEventListener('click', () => {
        if (!currentSongData) return;
        updateVideoModal();
        videoModal.style.display = 'flex';
    });
    closeVideo.addEventListener('click', () => {
        videoModal.style.display = 'none';
        videoIframe.src = '';
    });
    window.addEventListener('click', (e) => { if (e.target === videoModal) closeVideo.click(); });

    // ========== FAVORITOS ==========
    function updateFavButtonState() {}
    // No necesitamos favBtn en este diseño, pero mantenemos lógica de favoritos
    function toggleFavorite() {
        if (!currentSongData) return;
        const index = favorites.findIndex(f => f.id === currentSongData.id);
        if (index === -1) favorites.push(currentSongData);
        else favorites.splice(index, 1);
        localStorage.setItem('favorites', JSON.stringify(favorites));
    }

    // ========== COMUNICACIÓN CON BACKEND ==========
    async function fetchSongs(query, maxResults = 20) {
        try {
            const res = await fetch(`/search/${encodeURIComponent(query)}`);
            if (!res.ok) return [];
            const data = await res.json();
            return Array.isArray(data) ? data : [];
        } catch (err) { return []; }
    }

    // ========== RENDERIZADO ==========
    function renderCards(songs, containerId) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';
        if (!songs.length) { container.innerHTML = '<div class="loading-cards">🎵 No hay canciones</div>'; return; }
        songs.forEach(song => {
            const card = document.createElement('div');
            card.className = 'music-card';
            card.innerHTML = `
                <div class="card-img"><img src="${song.thumb}" alt="${escapeHtml(song.title)}"><button class="play-btn-overlay" data-id="${song.id}" data-title="${escapeHtml(song.title)}" data-thumb="${song.thumb}">▶</button></div>
                <div class="card-info"><div class="card-title">${escapeHtml(song.title)}</div><div class="card-sub">Artista</div></div>
            `;
            container.appendChild(card);
        });
        document.querySelectorAll('.play-btn-overlay').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = btn.dataset.id, title = btn.dataset.title, thumb = btn.dataset.thumb;
                playSong(id, title, thumb, true, true); // reemplaza cola
            });
        });
    }

    // Vistas dinámicas
    async function loadHome() {
        document.getElementById('mainContent').innerHTML = `<div class="hero"><h1>Buenas noches</h1><p>Música sin límites</p></div><div class="section-header"><h2>Recomendado para ti</h2></div><div class="cards-grid" id="homeGrid"></div>`;
        const songs = await fetchSongs('música popular', 20);
        renderCards(songs, 'homeGrid');
    }
    async function loadExplore() {
        document.getElementById('mainContent').innerHTML = `<div class="section-header"><h2>Explorar</h2></div><div class="cards-grid" id="exploreGrid"></div>`;
        const songs = await fetchSongs('exitos 2025', 20);
        renderCards(songs, 'exploreGrid');
    }
    async function loadRadio() {
        document.getElementById('mainContent').innerHTML = `<div class="section-header"><h2>Radio</h2></div><div class="cards-grid" id="radioGrid"></div>`;
        const songs = await fetchSongs('random mix', 16);
        renderCards(songs, 'radioGrid');
    }
    async function loadMixDiaria() {
        document.getElementById('mainContent').innerHTML = `<div class="section-header"><h2>Mezcla diaria</h2></div><div class="cards-grid" id="mixGrid"></div>`;
        const songs = await fetchSongs('daily mix', 18);
        renderCards(songs, 'mixGrid');
    }
    async function loadDriving() {
        document.getElementById('mainContent').innerHTML = `<div class="section-header"><h2>Conducción</h2></div><div class="cards-grid" id="drivingGrid"></div>`;
        const songs = await fetchSongs('driving music', 16);
        renderCards(songs, 'drivingGrid');
    }
    function loadFavoritesView() {
        document.getElementById('mainContent').innerHTML = `<div class="section-header"><h2>Favoritos</h2></div><div class="cards-grid" id="favGrid"></div>`;
        renderCards(favorites, 'favGrid');
    }
    async function performSearch(query) {
        document.getElementById('mainContent').innerHTML = `<div class="section-header"><h2>Resultados: "${escapeHtml(query)}"</h2></div><div class="cards-grid" id="searchGrid"></div>`;
        const songs = await fetchSongs(query, 24);
        renderCards(songs, 'searchGrid');
    }

    // Eventos de navegación (desktop + móvil)
    function setupNavigation() {
        const sections = ['home', 'explore', 'radio'];
        const activate = (section) => {
            if (section === 'home') loadHome();
            else if (section === 'explore') loadExplore();
            else if (section === 'radio') loadRadio();
            // Actualizar clases activas en ambos menús
            document.querySelectorAll('.nav-links a, .tab-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll(`.nav-links a[data-section="${section}"], .tab-item[data-section="${section}"]`).forEach(el => el.classList.add('active'));
        };
        document.querySelectorAll('.nav-links a, .tab-item').forEach(el => {
            el.addEventListener('click', (e) => {
                e.preventDefault();
                const section = el.dataset.section;
                if (section) activate(section);
                const playlist = el.dataset.playlist;
                if (playlist === 'favorites') loadFavoritesView();
                else if (playlist === 'mix') loadMixDiaria();
                else if (playlist === 'driving') loadDriving();
            });
        });
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch(e.target.value.trim());
        });
        // Controles del reproductor
        playPauseBtn.addEventListener('click', () => {
            if (isPlaying) player.pauseVideo();
            else player.playVideo();
        });
        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);
        progressBar.addEventListener('click', (e) => {
            if (!player || !player.getDuration) return;
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            const duration = player.getDuration();
            if (duration) player.seekTo(percent * duration, true);
        });
    }

    function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

    window.onload = () => {
        setupNavigation();
        loadHome();
    };
</script>
