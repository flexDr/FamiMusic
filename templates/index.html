<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fami Music</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#fa233b">
    <style>
        /* Aquí va TODO tu CSS igual que antes, sin cambios */
        /* ... (copia el estilo que ya tienes) ... */
    </style>
</head>
<body>
    <!-- El mismo HTML de la interfaz, igual que antes -->
    <!-- ... (sin cambios en la estructura) ... -->

    <script>
        // Variables globales
        let playlistActual = [];
        let indiceActual = 0;
        let memoriasInicio = {};
        let audioElement = null;
        let modoVideoActivo = false;
        let progresoIntervalo = null;
        let wakeLock = null;

        // Elementos DOM (igual que antes)
        const uiRep = document.getElementById('reproductor-ui');
        const btnPlay = document.getElementById('btn-play');
        const barra = document.getElementById('barra-progreso');
        const miniPlayer = document.getElementById('mini-player');
        const btnMiniPlay = document.getElementById('mini-play-btn');
        const cajaMedia = document.getElementById('media-box-anim');
        const elArte = document.getElementById('arte-cancion');
        const btnToggleVideo = document.getElementById('btn-toggle-video');

        // Iconos (igual)
        const iconPlay = `<svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
        const iconPause = `<svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
        const iconMiniPlay = `<svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
        const iconMiniPause = `<svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;

        // Inicializar audio nativo
        function initAudio() {
            audioElement = new Audio();
            audioElement.addEventListener('play', () => {
                actualizarUIPlay(true);
                solicitarWakeLock();
                actualizarMediaSession();
            });
            audioElement.addEventListener('pause', () => actualizarUIPlay(false));
            audioElement.addEventListener('ended', () => pistaSiguiente());
            audioElement.addEventListener('timeupdate', actualizarBarra);
            audioElement.addEventListener('loadedmetadata', () => {
                barra.max = audioElement.duration;
                document.getElementById('tiempo-restante').innerText = formatoTiempo(audioElement.duration);
            });
        }

        // Wake Lock para evitar que la pantalla se apague (opcional)
        async function solicitarWakeLock() {
            if ('wakeLock' in navigator && !wakeLock) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => { wakeLock = null; });
                } catch (err) { console.warn('Wake Lock no soportado'); }
            }
        }

        // Media Session (controles en pantalla de bloqueo)
        function actualizarMediaSession() {
            if (!playlistActual[indiceActual]) return;
            const pista = playlistActual[indiceActual];
            let tituloRaw = decodificarHTML(pista.title);
            let artista = "Fami Music";
            let titulo = tituloRaw;
            if (tituloRaw.includes("-")) {
                let partes = tituloRaw.split("-");
                artista = partes[0].trim();
                titulo = partes.slice(1).join("-").trim();
            }
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: titulo,
                    artist: artista,
                    artwork: [{ src: pista.thumb, sizes: '512x512', type: 'image/jpeg' }]
                });
                navigator.mediaSession.setActionHandler('play', () => audioElement.play());
                navigator.mediaSession.setActionHandler('pause', () => audioElement.pause());
                navigator.mediaSession.setActionHandler('nexttrack', () => pistaSiguiente());
                navigator.mediaSession.setActionHandler('previoustrack', () => pistaAnterior());
            }
        }

        // Reproducir canción (obteniendo audio desde backend)
        async function iniciarPista(indice, idContenedor) {
            playlistActual = memoriasInicio[idContenedor];
            indiceActual = indice;
            const pista = playlistActual[indiceActual];

            let tituloRaw = decodificarHTML(pista.title);
            let artista = "Fami Music";
            let titulo = tituloRaw;
            if (tituloRaw.includes("-")) {
                let partes = tituloRaw.split("-");
                artista = partes[0].trim();
                titulo = partes.slice(1).join("-").trim();
            }

            // Actualizar UI
            document.getElementById('titulo-actual').innerText = titulo;
            document.getElementById('artista-actual').innerText = artista;
            elArte.src = pista.thumb;
            document.getElementById('mini-title').innerText = titulo;
            document.getElementById('mini-img').src = pista.thumb;
            miniPlayer.style.display = 'flex';
            guardarEnHistorial(pista);
            abrirReproductor();

            // Obtener URL del audio desde el backend
            try {
                const res = await fetch(`/audio/${pista.id}`);
                const data = await res.json();
                if (data.audio_url) {
                    audioElement.src = data.audio_url;
                    audioElement.play().catch(e => console.warn("Autoplay bloqueado:", e));
                } else {
                    console.error("No se obtuvo URL de audio");
                }
            } catch (err) {
                console.error("Error al obtener audio:", err);
            }

            // Limpiar intervalo anterior y empezar nuevo
            if (progresoIntervalo) clearInterval(progresoIntervalo);
            progresoIntervalo = setInterval(actualizarBarra, 500);
        }

        function actualizarBarra() {
            if (audioElement && audioElement.duration) {
                barra.value = audioElement.currentTime;
                document.getElementById('tiempo-actual').innerText = formatoTiempo(audioElement.currentTime);
                const restante = audioElement.duration - audioElement.currentTime;
                document.getElementById('tiempo-restante').innerText = "-" + formatoTiempo(restante);
            }
        }

        function alternarPlay() {
            if (!audioElement) return;
            if (audioElement.paused) audioElement.play();
            else audioElement.pause();
        }

        function pistaSiguiente() {
            memoriasInicio['playlist_actual'] = playlistActual;
            if (indiceActual < playlistActual.length - 1) iniciarPista(indiceActual + 1, 'playlist_actual');
            else iniciarPista(0, 'playlist_actual');
        }

        function pistaAnterior() {
            memoriasInicio['playlist_actual'] = playlistActual;
            if (indiceActual > 0) iniciarPista(indiceActual - 1, 'playlist_actual');
        }

        function actualizarUIPlay(estaSonando) {
            if (estaSonando) {
                btnPlay.innerHTML = iconPause;
                btnMiniPlay.innerHTML = iconMiniPause;
                cajaMedia.classList.remove('pausado');
            } else {
                btnPlay.innerHTML = iconPlay;
                btnMiniPlay.innerHTML = iconMiniPlay;
                cajaMedia.classList.add('pausado');
            }
        }

        // Modo video (opcional, si quieres mostrar el videoclip)
        function alternarModoVideo() {
            modoVideoActivo = !modoVideoActivo;
            if (modoVideoActivo) {
                // Aquí podrías mostrar un iframe de YouTube en un modal
                alert("Próximamente: modo video (necesitarás iframe)");
            }
        }

        function formatoTiempo(segundos) {
            if (isNaN(segundos)) return "0:00";
            let min = Math.floor(segundos / 60);
            let sec = Math.floor(segundos % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // Barrra de progreso interactiva
        barra.oninput = (e) => {
            if (audioElement) audioElement.currentTime = e.target.value;
        };

        // Service Worker (para que la PWA se pueda instalar)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/service-worker.js')
                .then(reg => console.log('SW registrado', reg))
                .catch(err => console.error('SW error', err));
        }

        // Inicializar al cargar
        window.onload = () => {
            initAudio();
            cargarFila("bad bunny exitos", "fila-destacadas", "destacada");
            cargarHistorial();
            cargarFila("el alfa dembow oficial", "fila-dembow", "normal");
        };

        // Aquí van todas las demás funciones (cargarFila, crearTarjeta, etc.) igual que antes.
        // Las mantienes sin cambios.
    </script>
</body>
</html>
