<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fami Music</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-main: #ffffff;
            --text-muted: #a1a1a6;
            --accent: #fa233b; /* Rojo Apple Music */
            --card-bg: #1c1c1e;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main); padding-bottom: 100px; -webkit-font-smoothing: antialiased; }
        
        /* Cabecera Profesional */
        header { padding: 40px 20px 10px; font-size: 28px; font-weight: 700; border-bottom: 1px solid #333; position: sticky; top: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); z-index: 10; }
        
        /* Secciones y Carruseles */
        .section-container { margin-top: 25px; }
        .section-title { font-size: 20px; font-weight: 600; margin: 0 20px 10px; }
        .carousel { display: flex; overflow-x: auto; padding: 0 20px; gap: 15px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
        .carousel::-webkit-scrollbar { display: none; }
        
        .card { width: 140px; flex-shrink: 0; scroll-snap-align: start; }
        .card img { width: 100%; height: 140px; border-radius: 12px; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card-title { font-size: 14px; font-weight: 500; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-artist { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Reproductor Apple Music Style (Oculto al inicio, sube al darle play) */
        #player-ui { position: fixed; bottom: 0; left: 0; width: 100%; height: 100vh; background: rgba(28, 28, 30, 0.95); backdrop-filter: blur(30px); transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); z-index: 100; padding: 40px 20px; display: flex; flex-direction: column; }
        #player-ui.active { transform: translateY(0); }
        
        .close-btn { align-self: center; width: 40px; height: 5px; background: #555; border-radius: 10px; margin-bottom: 30px; cursor: pointer; }
        
        /* Soporte Mixto: Imagen o Video */
        .media-container { width: 100%; aspect-ratio: 1/1; border-radius: 16px; overflow: hidden; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 30px; }
        .media-container img, .media-container video { width: 100%; height: 100%; object-fit: cover; display: none; }
        .media-container img.active, .media-container video.active { display: block; }

        .info-controls { text-align: left; margin-bottom: 20px; }
        .track-name { font-size: 24px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .artist-name { font-size: 18px; color: var(--accent); }
        
        /* Barra de progreso */
        .progress-area { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
        input[type="range"] { width: 100%; margin: 10px 0; accent-color: var(--text-main); }
        
        /* Botones principales */
        .main-controls { display: flex; justify-content: center; align-items: center; gap: 40px; margin-top: 20px; }
        .btn-circle { width: 60px; height: 60px; border-radius: 50%; background: var(--text-main); color: #000; border: none; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .btn-icon { background: none; border: none; color: var(--text-main); font-size: 28px; cursor: pointer; }
        
        /* Toggle de Video */
        .video-toggle { margin-top: 30px; text-align: center; }
        .video-toggle button { background: #333; color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .video-toggle button.on { background: var(--accent); }
    </style>
</head>
<body>

    <header>Explorar</header>

    <div class="section-container">
        <div class="section-title">Sugerencias destacadas para ti</div>
        <div class="carousel" id="sec-destacadas"></div>
    </div>

    <div class="section-container">
        <div class="section-title">Escuchado recientemente</div>
        <div class="carousel" id="sec-recientes"></div>
    </div>

    <div class="section-container">
        <div class="section-title">Recomendado para ti</div>
        <div class="carousel" id="sec-recomendado"></div>
    </div>

    <div class="section-container">
        <div class="section-title">Dembow</div>
        <div class="carousel" id="sec-dembow"></div>
    </div>

    <div class="section-container">
        <div class="section-title">Bachata</div>
        <div class="carousel" id="sec-bachata"></div>
    </div>

    <div id="player-ui">
        <div class="close-btn" onclick="cerrarReproductor()"></div>
        
        <div class="media-container">
            <img id="player-img" class="active" src="" alt="Portada">
            <video id="player-video" playsinline></video>
        </div>

        <div class="info-controls">
            <div class="track-name" id="player-title">Cargando...</div>
            <div class="artist-name" id="player-artist">Fami Music</div>
        </div>

        <div class="progress-area">
            <span id="time-current">0:00</span>
            <span id="time-total">-0:00</span>
        </div>
        <input type="range" id="progress-bar" value="0" min="0" max="100">

        <div class="main-controls">
            <button class="btn-icon" onclick="cancionAnterior()">⏮</button>
            <button class="btn-circle" id="btn-play-pause" onclick="togglePlay()">⏸</button>
            <button class="btn-icon" onclick="cancionSiguiente()">⏭</button>
        </div>

        <div class="video-toggle">
            <button id="btn-video" onclick="alternarVideo()">Activar Video</button>
        </div>
        
        <audio id="main-audio"></audio>
    </div>

    <script src="app.js"></script>
</body>
</html>
