<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>FamiMusic - Apple Music Style</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <h2>FamiMusic</h2>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Buscar canción, artista...">
            </div>
            <div id="results" class="results-list"></div>
        </aside>
        <main class="player-area">
            <div id="youtube-player"></div>
            <div id="nowPlaying" class="now-playing">🎵 Selecciona una canción</div>
        </main>
    </div>

    <!-- Cargar la API de YouTube IFrame -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let currentVideoId = null;

        // Inicializar el reproductor cuando la API esté lista
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0',       // Oculto (solo audio)
                width: '0',
                playerVars: {
                    autoplay: 0,
                    controls: 0,
                    modestbranding: 1,
                    rel: 0,
                    enablejsapi: 1,
                    mute: 1        // Necesario para autoplay silencioso al inicio
                },
                events: {
                    onReady: onPlayerReady,
                    onStateChange: onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            console.log("✅ Reproductor listo");
            // Podrías cargar una playlist por defecto
            searchSongs('música relajante');
        }

        function onPlayerStateChange(event) {
            // Si el video empieza a sonar y aún está silenciado, mostramos botón para activar sonido
            if (event.data === YT.PlayerState.PLAYING && player.isMuted()) {
                showUnmuteButton();
            }
        }

        function showUnmuteButton() {
            let btn = document.getElementById('unmuteBtn');
            if (!btn) {
                btn = document.createElement('button');
                btn.id = 'unmuteBtn';
                btn.textContent = '🔊 Activar sonido';
                btn.style.position = 'fixed';
                btn.style.bottom = '20px';
                btn.style.right = '20px';
                btn.style.padding = '12px 20px';
                btn.style.background = '#ff3b30';
                btn.style.color = 'white';
                btn.style.border = 'none';
                btn.style.borderRadius = '40px';
                btn.style.cursor = 'pointer';
                btn.style.zIndex = '1000';
                btn.style.fontWeight = 'bold';
                btn.style.boxShadow = '0 2px 10px rgba(0,0,0,0.3)';
                btn.onclick = () => {
                    player.unMute();
                    btn.remove();
                };
                document.body.appendChild(btn);
            }
        }

        // Búsqueda de canciones
        const searchInput = document.getElementById('searchInput');
        const resultsDiv = document.getElementById('results');

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const query = searchInput.value.trim();
                if (query) searchSongs(query);
            }
        });

        async function searchSongs(query) {
            resultsDiv.innerHTML = '<div class="loading">🔍 Buscando...</div>';
            try {
                const res = await fetch(`/search/${encodeURIComponent(query)}`);
                const songs = await res.json();
                if (!songs.length) {
                    resultsDiv.innerHTML = '<div class="loading">😕 No se encontraron canciones</div>';
                    return;
                }
                renderResults(songs);
            } catch (err) {
                console.error(err);
                resultsDiv.innerHTML = '<div class="loading">❌ Error al buscar</div>';
            }
        }

        function renderResults(songs) {
            resultsDiv.innerHTML = '';
            songs.forEach(song => {
                const card = document.createElement('div');
                card.className = 'song-card';
                card.innerHTML = `
                    <img src="${escapeHtml(song.thumb)}" alt="cover">
                    <div class="info">
                        <div class="title">${escapeHtml(song.title)}</div>
                    </div>
                `;
                card.onclick = () => playSong(song.id, song.title);
                resultsDiv.appendChild(card);
            });
        }

        // Reproducir canción
        async function playSong(videoId, title) {
            currentVideoId = videoId;
            document.getElementById('nowPlaying').innerHTML = `🎶 Ahora suena: <strong>${escapeHtml(title)}</strong>`;
            
            if (player && player.loadVideoById) {
                // Esto iniciará la reproducción automáticamente porque el player se creó con mute=1
                // El usuario ya hizo clic en una tarjeta (interacción válida para desbloquear audio)
                player.loadVideoById({
                    videoId: videoId,
                    startSeconds: 0
                });
            } else {
                console.warn("Player no listo aún");
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Búsqueda inicial por si no hay interacción
        window.onload = () => {
            // Esperar un poco a que el player se inicialice
            setTimeout(() => {
                if (!currentVideoId) searchSongs('pop hits');
            }, 1000);
        };
    </script>
</body>
</html>
