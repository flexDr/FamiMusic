<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fami Music</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#fa233b">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --text: #ffffff; --text-muted: #ebebf599; --accent: #fa233b; --tab-bg: rgba(0, 0, 0, 0.4); }
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; background: #000; color: #fff; padding-bottom: 150px; -webkit-font-smoothing: antialiased; }
        .aurora-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; background: #000; }
        .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.5; animation: auroraAnim 15s infinite alternate; }
        .blob1 { width: 350px; height: 350px; background: #fa233b; top: -10%; left: -10%; }
        .blob2 { width: 450px; height: 450px; background: #5e17eb; bottom: -20%; right: -10%; animation-delay: -5s; }
        @keyframes auroraAnim { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(40px,40px) scale(1.1); } }
        header { padding: 50px 20px 15px; font-size: 34px; font-weight: 800; position: sticky; top: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(30px); border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        .vista { display: none; }
        .vista.activa { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .seccion { margin-top: 35px; }
        .titulo-seccion { font-size: 22px; font-weight: 700; margin: 0 20px 15px; display: flex; align-items: center; }
        .titulo-seccion::after { content: '›'; margin-left: 8px; color: var(--text-muted); font-size: 24px; }
        .carrusel { display: flex; overflow-x: auto; padding: 0 20px; gap: 15px; scroll-snap-type: x mandatory; }
        .carrusel::-webkit-scrollbar { display: none; }
        .tarjeta-destacada { width: 300px; height: 380px; flex-shrink: 0; scroll-snap-align: start; cursor: pointer; position: relative; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .tarjeta-destacada img { width: 100%; height: 100%; object-fit: cover; }
        .overlay-destacada { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.8) 100%); }
        .textos-destacados { position: absolute; bottom: 20px; left: 15px; right: 15px; }
        .titulo-destacado { font-size: 13px; color: rgba(255,255,255,0.7); text-transform: uppercase; }
        .subtitulo-destacado { font-size: 24px; font-weight: 700; color: #fff; line-height: 1.1; }
        .desc-destacado { font-size: 14px; color: var(--text-muted); margin-top: 6px; }
        .tarjeta-mix { width: 160px; flex-shrink: 0; scroll-snap-align: start; cursor: pointer; }
        .mix-fondo { width: 160px; height: 160px; border-radius: 12px; position: relative; overflow: hidden; box-shadow: 0 6px 16px rgba(0,0,0,0.4); background: linear-gradient(135deg, #4568dc, #b06ab3); }
        .circulo-1 { position: absolute; width: 90px; height: 90px; border-radius: 50%; object-fit: cover; top: 15%; left: 10%; z-index: 2; }
        .circulo-2 { position: absolute; width: 65px; height: 65px; border-radius: 50%; object-fit: cover; bottom: 15%; right: 10%; z-index: 3; }
        .circulo-3 { position: absolute; width: 45px; height: 45px; border-radius: 50%; object-fit: cover; bottom: 5%; left: 40%; z-index: 4; }
        .titulo-tarjeta { font-size: 15px; font-weight: 500; margin-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .artista-tarjeta { font-size: 13px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tarjeta-normal { width: 145px; flex-shrink: 0; scroll-snap-align: start; cursor: pointer; }
        .tarjeta-normal img { width: 145px; height: 145px; border-radius: 12px; object-fit: cover; }
        .lista-resultados { display: flex; flex-direction: column; padding: 0 20px; }
        .fila-lista { display: flex; align-items: center; padding: 12px 0; border-bottom: 0.5px solid rgba(255,255,255,0.08); cursor: pointer; }
        .fila-lista img { width: 55px; height: 55px; border-radius: 8px; margin-right: 15px; object-fit: cover; }
        .mensaje-carga { padding: 20px; color: var(--text-muted); text-align: center; }
        #mini-player { display: none; position: fixed; bottom: 95px; left: 15px; right: 15px; height: 64px; border-radius: 16px; align-items: center; padding: 0 15px; background: rgba(30,30,32,0.7); backdrop-filter: blur(30px); border: 0.5px solid rgba(255,255,255,0.15); z-index: 90; cursor: pointer; }
        #mini-img { width: 44px; height: 44px; border-radius: 10px; margin-right: 12px; }
        .mini-info { flex: 1; overflow: hidden; }
        .mini-titulo { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-btn { background: none; border: none; color: #fff; cursor: pointer; padding: 5px; }
        #reproductor-ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(50px); transform: translateY(100%); transition: transform 0.4s; z-index: 100; padding: 40px 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #reproductor-ui.activo { transform: translateY(0); }
        .btn-cerrar { width: 40px; height: 5px; background: rgba(255,255,255,0.4); border-radius: 10px; margin-bottom: 30px; cursor: pointer; }
        .media-box { width: 100%; max-width: 320px; aspect-ratio: 1; border-radius: 16px; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.6); margin-bottom: 30px; position: relative; transition: transform 0.3s; }
        .media-box.pausado { transform: scale(0.85); }
        #arte-cancion { width: 100%; height: 100%; object-fit: cover; }
        .info-pista { width: 100%; max-width: 320px; margin-bottom: 20px; text-align: left; }
        .nombre-pista { font-size: 22px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .nombre-artista { font-size: 18px; color: var(--accent); margin-top: 4px; }
        .controles-wraper { width: 100%; max-width: 320px; }
        .tiempos { display: flex; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,0.5); }
        input[type="range"] { width: 100%; margin: 10px 0 25px; appearance: none; background: rgba(255,255,255,0.2); height: 5px; border-radius: 3px; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; background: #fff; border-radius: 50%; }
        .controles-main { display: flex; justify-content: center; align-items: center; gap: 40px; margin-bottom: 30px; }
        .btn-icono { background: none; border: none; color: #fff; cursor: pointer; }
        .btn-play { width: 65px; height: 65px; border-radius: 50%; background: #fff; color: #000; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .tab-bar { position: fixed; bottom: 0; left: 0; width: 100%; height: 85px; background: var(--tab-bg); backdrop-filter: blur(30px); display: flex; justify-content: space-around; padding-top: 10px; border-top: 0.5px solid rgba(255,255,255,0.1); z-index: 80; }
        .tab { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); cursor: pointer; width: 33%; font-size: 10px; }
        .tab svg { width: 26px; height: 26px; margin-bottom: 4px; fill: currentColor; }
        .tab.activo { color: var(--accent); }
        .search-box { padding: 0 20px 10px; }
        .search-box input { width: 100%; background: rgba(255,255,255,0.15); border: none; padding: 12px 15px; border-radius: 10px; color: white; font-size: 16px; outline: none; }
        .switch-video button { background: rgba(255,255,255,0.15); color: #fff; border: none; padding: 12px 25px; border-radius: 25px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; max-width: 320px; }
    </style>
</head>
<body>
    <div class="aurora-bg"><div class="blob blob1"></div><div class="blob blob2"></div></div>

    <div id="vista-inicio" class="vista activa">
        <header>Escuchar</header>
        <div class="seccion"><div class="titulo-seccion">Sugerencias destacadas</div><div class="carrusel" id="fila-destacadas"></div></div>
        <div class="seccion"><div class="titulo-seccion">Escuchado recientemente</div><div class="carrusel" id="fila-recientes"></div></div>
        <div class="seccion"><div class="titulo-seccion">Puro Dembow</div><div class="carrusel" id="fila-dembow"></div></div>
    </div>
    <div id="vista-buscar" class="vista">
        <header>Buscar</header>
        <div class="search-box"><input type="text" id="input-buscador" placeholder="Artistas, canciones..."></div>
        <div class="lista-resultados" id="grid-buscar"><div class="mensaje-carga">Busca tus temas favoritos.</div></div>
    </div>
    <div id="vista-biblioteca" class="vista">
        <header>Biblioteca</header>
        <div class="seccion"><div class="titulo-seccion">Recientemente añadidos</div><div class="lista-resultados" id="grid-biblioteca"></div></div>
    </div>

    <div id="mini-player" onclick="abrirReproductor()">
        <img id="mini-img" src="">
        <div class="mini-info"><div class="mini-titulo" id="mini-title">...</div></div>
        <button class="mini-btn" id="mini-play-btn" onclick="alternarPlayFiltro(event)"><svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
    </div>

    <div id="reproductor-ui">
        <div class="btn-cerrar" onclick="cerrarReproductor()"></div>
        <div class="media-box pausado" id="media-box-anim">
            <img id="arte-cancion" src="">
        </div>
        <div class="info-pista">
            <div class="nombre-pista" id="titulo-actual">Selecciona un tema</div>
            <div class="nombre-artista" id="artista-actual">Fami Music</div>
        </div>
        <div class="controles-wraper">
            <input type="range" id="barra-progreso" value="0" min="0" max="100">
            <div class="tiempos"><span id="tiempo-actual">0:00</span><span id="tiempo-restante">-0:00</span></div>
        </div>
        <div class="controles-main">
            <button class="btn-icono" onclick="pistaAnterior()"><svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
            <button class="btn-play" id="btn-play" onclick="alternarPlay()"><svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
            <button class="btn-icono" onclick="pistaSiguiente()"><svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
        </div>
        <div class="switch-video">
            <button id="btn-toggle-video" onclick="alert('Modo video próximamente')">Ver Video Oficial</button>
        </div>
    </div>

    <nav class="tab-bar">
        <div class="tab activo" onclick="cambiarTab('inicio', this)"><svg viewBox="0 0 24 24"><path d="M12 3L4 9v12h5v-7h6v7h5V9z"/></svg><span>Escuchar</span></div>
        <div class="tab" onclick="cambiarTab('buscar', this)"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><span>Buscar</span></div>
        <div class="tab" onclick="cambiarTab('biblioteca', this)"><svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z"/></svg><span>Biblioteca</span></div>
    </nav>

    <script>
        // ========== VARIABLES GLOBALES ==========
        let playlistActual = [];
        let indiceActual = 0;
        let memoriasInicio = {};
        let audioElement = null;
        let progresoIntervalo = null;
        let wakeLock = null;

        // Elementos DOM
        const uiRep = document.getElementById('reproductor-ui');
        const btnPlay = document.getElementById('btn-play');
        const barra = document.getElementById('barra-progreso');
        const miniPlayer = document.getElementById('mini-player');
        const btnMiniPlay = document.getElementById('mini-play-btn');
        const cajaMedia = document.getElementById('media-box-anim');
        const elArte = document.getElementById('arte-cancion');

        const iconPlay = `<svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
        const iconPause = `<svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
        const iconMiniPlay = `<svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
        const iconMiniPause = `<svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;

        // ========== INICIALIZACIÓN DEL AUDIO NATIVO ==========
        function initAudio() {
            audioElement = new Audio();
            audioElement.addEventListener('play', () => {
                actualizarUIPlay(true);
                solicitarWakeLock();
                actualizarMediaSession();
            });
            audioElement.addEventListener('pause', () => actualizarUIPlay(false));
            audioElement.addEventListener('ended', () => pistaSiguiente());
            audioElement.addEventListener('timeupdate', actualizarBarra);
            audioElement.addEventListener('loadedmetadata', () => {
                barra.max = audioElement.duration;
                document.getElementById('tiempo-restante').innerText = formatoTiempo(audioElement.duration);
            });
            audioElement.addEventListener('error', (e) => console.error('Error de audio:', e));
        }

        async function solicitarWakeLock() {
            if ('wakeLock' in navigator && !wakeLock) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => { wakeLock = null; });
                    console.log('Wake Lock activado');
                } catch (err) { console.warn('Wake Lock no soportado'); }
            }
        }

        function actualizarMediaSession() {
            if (!playlistActual[indiceActual]) return;
            const pista = playlistActual[indiceActual];
            let tituloRaw = decodificarHTML(pista.title);
            let artista = "Fami Music";
            let titulo = tituloRaw;
            if (tituloRaw.includes("-")) {
                let partes = tituloRaw.split("-");
                artista = partes[0].trim();
                titulo = partes.slice(1).join("-").trim();
            }
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: titulo,
                    artist: artista,
                    artwork: [{ src: pista.thumb, sizes: '512x512', type: 'image/jpeg' }]
                });
                navigator.mediaSession.setActionHandler('play', () => audioElement.play());
                navigator.mediaSession.setActionHandler('pause', () => audioElement.pause());
                navigator.mediaSession.setActionHandler('nexttrack', () => pistaSiguiente());
                navigator.mediaSession.setActionHandler('previoustrack', () => pistaAnterior());
            }
        }

        // ========== FUNCIONES DE INTERFAZ ==========
        function cambiarTab(idVista, tabElement) {
            document.querySelectorAll('.vista').forEach(v => v.classList.remove('activa'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('activo'));
            document.getElementById('vista-' + idVista).classList.add('activa');
            tabElement.classList.add('activo');
            if (idVista === 'biblioteca') cargarBiblioteca();
        }

        function decodificarHTML(html) {
            let txt = document.createElement("textarea");
            txt.innerHTML = html;
            return txt.value.replace(/['"]/g, '').trim();
        }

        function crearTarjeta(cancion, index, idContenedor, tipo) {
            let tituloRaw = cancion.title ? decodificarHTML(cancion.title) : "Desconocido";
            let artista = "Fami Music";
            let titulo = tituloRaw;
            if (tituloRaw.includes("-")) {
                let partes = tituloRaw.split("-");
                artista = partes[0].trim();
                titulo = partes.slice(1).join("-").trim();
            }

            if (tipo === 'destacada') {
                return `<div class="tarjeta-destacada" onclick="iniciarPista(${index}, '${idContenedor}')">
                            <img src="${cancion.thumb}" onerror="this.src='https://ui-avatars.com/api/?name=Fami&background=1c1c1e&color=fff'">
                            <div class="overlay-destacada"></div>
                            <div class="textos-destacados">
                                <div class="titulo-destacado">HECHOS PARA TI</div>
                                <div class="subtitulo-destacado">${titulo}</div>
                                <div class="desc-destacado">${artista}, y más artistas similares.</div>
                            </div>
                        </div>`;
            } else if (tipo === 'mix') {
                return `<div class="tarjeta-mix" onclick="iniciarPista(${index}, '${idContenedor}')">
                            <div class="mix-fondo">
                                <img src="${cancion.thumb}" class="circulo-1">
                                <img src="${cancion.thumb}" class="circulo-2">
                                <img src="${cancion.thumb}" class="circulo-3">
                            </div>
                            <div class="titulo-tarjeta">${artista} y similares</div>
                            <div class="artista-tarjeta">Estación de radio</div>
                        </div>`;
            } else if (tipo === 'lista') {
                return `<div class="fila-lista" onclick="iniciarPista(${index}, '${idContenedor}')">
                            <img src="${cancion.thumb}">
                            <div class="textos-lista">
                                <div class="titulo-tarjeta">${titulo}</div>
                                <div class="artista-tarjeta">${artista}</div>
                            </div>
                        </div>`;
            } else {
                return `<div class="tarjeta-normal" onclick="iniciarPista(${index}, '${idContenedor}')">
                            <img src="${cancion.thumb}">
                            <div class="titulo-tarjeta">${titulo}</div>
                            <div class="artista-tarjeta">${artista}</div>
                        </div>`;
            }
        }

        async function cargarFila(busqueda, idContenedor, tipoUi) {
            const contenedor = document.getElementById(idContenedor);
            if (!contenedor) return;
            contenedor.innerHTML = '<div class="mensaje-carga">Buscando...</div>';
            try {
                const res = await fetch(`/search/${encodeURIComponent(busqueda)}`);
                const datos = await res.json();
                if (!datos || datos.length === 0) throw new Error("Vacío");
                memoriasInicio[idContenedor] = datos;
                contenedor.innerHTML = datos.map((c, i) => crearTarjeta(c, i, idContenedor, tipoUi)).join('');
            } catch (e) {
                contenedor.innerHTML = '<div class="mensaje-carga">Error al cargar.</div>';
            }
        }

        let searchTimeout = null;
        const inputBuscador = document.getElementById('input-buscador');
        if (inputBuscador) {
            inputBuscador.oninput = (e) => {
                const query = e.target.value.trim();
                if (query.length < 2) return;
                clearTimeout(searchTimeout);
                document.getElementById('grid-buscar').innerHTML = '<div class="mensaje-carga">Buscando...</div>';
                searchTimeout = setTimeout(() => { cargarFila(query, 'grid-buscar', 'lista'); }, 800);
            };
        }

        function cargarHistorial() {
            let historial = JSON.parse(localStorage.getItem('Fami_Memoria')) || [];
            const cont = document.getElementById('fila-recientes');
            if (!cont) return;
            if (historial.length === 0) {
                cont.innerHTML = '<div class="mensaje-carga">Aún no has escuchado nada.</div>';
                return;
            }
            memoriasInicio['fila-recientes'] = historial;
            cont.innerHTML = historial.map((c, i) => crearTarjeta(c, i, 'fila-recientes', 'mix')).join('');
        }

        function cargarBiblioteca() {
            let lib = JSON.parse(localStorage.getItem('Fami_Memoria')) || [];
            const cont = document.getElementById('grid-biblioteca');
            if (!cont) return;
            if (lib.length === 0) {
                cont.innerHTML = '<div class="mensaje-carga">Tu biblioteca está vacía.</div>';
                return;
            }
            memoriasInicio['grid-biblioteca'] = lib;
            cont.innerHTML = lib.map((c, i) => crearTarjeta(c, i, 'grid-biblioteca', 'lista')).join('');
        }

        function guardarEnHistorial(cancion) {
            let h = JSON.parse(localStorage.getItem('Fami_Memoria')) || [];
            h = h.filter(item => item.id !== cancion.id);
            h.unshift(cancion);
            if (h.length > 20) h.pop();
            localStorage.setItem('Fami_Memoria', JSON.stringify(h));
            cargarHistorial();
        }

        // ========== REPRODUCCIÓN DE AUDIO ==========
        async function iniciarPista(indice, idContenedor) {
            if (!audioElement) return alert("Cargando reproductor...");
            playlistActual = memoriasInicio[idContenedor];
            indiceActual = indice;
            const pista = playlistActual[indiceActual];

            let tituloRaw = decodificarHTML(pista.title);
            let artista = "Fami Music";
            let titulo = tituloRaw;
            if (tituloRaw.includes("-")) {
                let partes = tituloRaw.split("-");
                artista = partes[0].trim();
                titulo = partes.slice(1).join("-").trim();
            }

            document.getElementById('titulo-actual').innerText = titulo;
            document.getElementById('artista-actual').innerText = artista;
            elArte.src = pista.thumb;
            document.getElementById('mini-title').innerText = titulo;
            document.getElementById('mini-img').src = pista.thumb;
            miniPlayer.style.display = 'flex';
            guardarEnHistorial(pista);
            abrirReproductor();

            try {
                const res = await fetch(`/audio/${pista.id}`);
                const data = await res.json();
                if (data.audio_url) {
                    audioElement.src = data.audio_url;
                    audioElement.play().catch(e => console.log("Autoplay bloqueado:", e));
                } else {
                    console.error("No se obtuvo URL de audio");
                }
            } catch (err) {
                console.error("Error al obtener audio:", err);
            }

            if (progresoIntervalo) clearInterval(progresoIntervalo);
            progresoIntervalo = setInterval(actualizarBarra, 500);
        }

        function abrirReproductor() {
            uiRep.classList.add('activo');
            document.body.classList.add('bloqueado');
        }
        function cerrarReproductor() {
            uiRep.classList.remove('activo');
            document.body.classList.remove('bloqueado');
        }

        function alternarPlay() {
            if (!audioElement) return;
            if (audioElement.paused) audioElement.play();
            else audioElement.pause();
        }
        function alternarPlayFiltro(e) { e.stopPropagation(); alternarPlay(); }

        function actualizarUIPlay(estaSonando) {
            if (estaSonando) {
                btnPlay.innerHTML = iconPause;
                btnMiniPlay.innerHTML = iconMiniPause;
                cajaMedia.classList.remove('pausado');
            } else {
                btnPlay.innerHTML = iconPlay;
                btnMiniPlay.innerHTML = iconMiniPlay;
                cajaMedia.classList.add('pausado');
            }
        }

        function pistaSiguiente() {
            if (!playlistActual.length) return;
            memoriasInicio['playlist_actual'] = playlistActual;
            let newIndex = (indiceActual + 1) % playlistActual.length;
            iniciarPista(newIndex, 'playlist_actual');
        }
        function pistaAnterior() {
            if (!playlistActual.length) return;
            memoriasInicio['playlist_actual'] = playlistActual;
            let newIndex = (indiceActual - 1 + playlistActual.length) % playlistActual.length;
            iniciarPista(newIndex, 'playlist_actual');
        }

        function actualizarBarra() {
            if (audioElement && audioElement.duration && !isNaN(audioElement.duration)) {
                barra.value = audioElement.currentTime;
                document.getElementById('tiempo-actual').innerText = formatoTiempo(audioElement.currentTime);
                let restante = audioElement.duration - audioElement.currentTime;
                document.getElementById('tiempo-restante').innerText = "-" + formatoTiempo(restante);
            }
        }

        function formatoTiempo(segundos) {
            if (isNaN(segundos) || segundos < 0) return "0:00";
            let min = Math.floor(segundos / 60);
            let sec = Math.floor(segundos % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        barra.oninput = (e) => { if (audioElement) audioElement.currentTime = e.target.value; };

        // ========== SERVICE WORKER ==========
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/service-worker.js')
                .then(reg => console.log('SW registrado', reg))
                .catch(err => console.error('SW error', err));
        }

        // ========== INICIO ==========
        window.onload = () => {
            initAudio();
            cargarFila("bad bunny exitos", "fila-destacadas", "destacada");
            cargarHistorial();
            cargarFila("el alfa dembow oficial", "fila-dembow", "normal");
        };
    </script>
</body>
</html>
