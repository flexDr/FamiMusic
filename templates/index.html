<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FamiMusic - Test</title>
    <style>
        body { font-family: sans-serif; background: #0a0a0a; color: white; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 20px; }
        .card { background: #1e1e1e; border-radius: 12px; padding: 12px; cursor: pointer; }
        .card img { width: 100%; border-radius: 8px; }
        .card h3 { font-size: 14px; margin: 8px 0 0; }
        .player-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #111; padding: 12px; display: flex; gap: 12px; }
    </style>
</head>
<body>
    <h1>FamiMusic - Prueba de API</h1>
    <div id="results" class="grid">Cargando...</div>
    <div id="player-bar" class="player-bar" style="display: none;">
        <img id="current-thumb" width="48" height="48">
        <span id="current-title"></span>
        <button id="play-pause">▶️</button>
    </div>

    <div id="youtube-player" style="position: absolute; bottom: 0; opacity: 0;"></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let currentVideoId = null;
        let isPlaying = false;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0', width: '0',
                playerVars: { autoplay: 0, controls: 0, mute: 1, enablejsapi: 1 },
                events: {
                    onReady: () => console.log("Player listo"),
                    onStateChange: (e) => {
                        if (e.data === YT.PlayerState.PLAYING) {
                            isPlaying = true;
                            document.getElementById('play-pause').textContent = '⏸️';
                            if (player.isMuted()) {
                                let btn = document.createElement('button');
                                btn.textContent = 'Activar sonido';
                                btn.onclick = () => { player.unMute(); btn.remove(); };
                                document.body.appendChild(btn);
                            }
                        } else if (e.data === YT.PlayerState.PAUSED) {
                            isPlaying = false;
                            document.getElementById('play-pause').textContent = '▶️';
                        }
                    }
                }
            });
        }

        async function loadSongs() {
            try {
                const res = await fetch('/search/música');
                if (!res.ok) throw new Error('Error HTTP: ' + res.status);
                const songs = await res.json();
                console.log('Canciones recibidas:', songs);
                const container = document.getElementById('results');
                if (!songs.length) {
                    container.innerHTML = '<p>No se encontraron canciones. Revisa la consola.</p>';
                    return;
                }
                container.innerHTML = '';
                songs.forEach(song => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${song.thumb}" onerror="this.src='https://via.placeholder.com/200'">
                        <h3>${escapeHtml(song.title)}</h3>
                    `;
                    card.onclick = () => playSong(song.id, song.title, song.thumb);
                    container.appendChild(card);
                });
            } catch (err) {
                console.error('Error al cargar canciones:', err);
                document.getElementById('results').innerHTML = `<p>Error: ${err.message}. Verifica que el backend esté funcionando y la API key configurada.</p>`;
            }
        }

        function playSong(id, title, thumb) {
            if (!player) return;
            currentVideoId = id;
            document.getElementById('current-title').textContent = title;
            document.getElementById('current-thumb').src = thumb;
            document.getElementById('player-bar').style.display = 'flex';
            player.loadVideoById({ videoId: id, startSeconds: 0 });
        }

        document.getElementById('play-pause').onclick = () => {
            if (!currentVideoId) return;
            if (isPlaying) player.pauseVideo();
            else player.playVideo();
        };

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        loadSongs();
    </script>
</body>
</html>
