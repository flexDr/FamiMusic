<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fami Music</title>
    <style>
        /* Estilos Apple Music Glassmorphism */
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; margin: 0; padding-bottom: 100px; }
        header { padding: 40px 20px; font-size: 32px; font-weight: 800; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 10; }
        .seccion { margin: 20px; }
        .carrusel { display: flex; overflow-x: auto; gap: 15px; }
        .tarjeta { width: 150px; flex-shrink: 0; cursor: pointer; }
        .tarjeta img { width: 150px; height: 150px; border-radius: 12px; }
        .titulo { font-size: 14px; margin-top: 8px; white-space: nowrap; overflow: hidden; }
        
        /* Reproductor Nativo */
        #reproductor { position: fixed; bottom: 0; width: 100%; height: 80px; background: rgba(30,30,30,0.95); backdrop-filter: blur(20px); display: flex; align-items: center; padding: 0 20px; border-top: 1px solid #444; }
        #play-btn { font-size: 30px; background: none; border: none; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <header>Escuchar</header>
    <div class="seccion">
        <div class="carrusel" id="fila-destacadas"></div>
    </div>

    <div id="reproductor">
        <button id="play-btn" onclick="togglePlay()">▶</button>
        <span id="titulo-reproduciendo" style="margin-left: 15px;">Selecciona un tema</span>
        <audio id="audio-player"></audio>
    </div>

    <script>
        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');

        async function cargarInicio() {
            const res = await fetch('/search/Bad Bunny');
            const data = await res.json();
            const carrusel = document.getElementById('fila-destacadas');
            carrusel.innerHTML = data.map(item => `
                <div class="tarjeta" onclick="reproducir('${item.id}', '${item.title}')">
                    <img src="${item.thumb}">
                    <div class="titulo">${item.title}</div>
                </div>
            `).join('');
        }

        async function reproducir(id, title) {
            document.getElementById('titulo-reproduciendo').innerText = title;
            const res = await fetch(`/audio/${id}`);
            const data = await res.json();
            audio.src = data.url;
            audio.play();
            playBtn.innerText = "⏸";
        }

        function togglePlay() {
            if(audio.paused) { audio.play(); playBtn.innerText = "⏸"; }
            else { audio.pause(); playBtn.innerText = "▶"; }
        }

        cargarInicio();
    </script>
</body>
</html>
