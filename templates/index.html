<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FamiMusic</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#030303">
    <style>
        /* Estilos Base - Estética YouTube Music */
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #030303; /* Negro profundo YT */
            color: #ffffff; 
            font-family: 'Roboto', -apple-system, sans-serif; 
            padding-bottom: 90px; 
        }

        /* Barra de Navegación Superior */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px 30px; 
            background: #030303; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.5px;
        }

        /* Barra de Búsqueda Minimalista */
        .search-box { 
            display: flex; 
            flex: 1; 
            max-width: 400px; 
            background: #212121; /* Gris oscuro YT */
            border-radius: 8px; 
            padding: 2px;
            border: 1px solid #303030;
        }
        
        .search-box input { 
            flex: 1; 
            background: transparent; 
            border: none; 
            padding: 10px 15px; 
            color: white; 
            font-size: 16px; 
            outline: none; 
        }
        
        .search-box input::placeholder {
            color: #aaaaaa;
        }

        .search-box button { 
            background: transparent; 
            border: none; 
            color: #aaaaaa; 
            padding: 0 15px; 
            cursor: pointer; 
            font-weight: bold;
            transition: color 0.2s;
        }

        .search-box button:hover {
            color: #ffffff;
        }

        /* Cuadrícula de Resultados */
        .resultados { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 24px; 
            padding: 30px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        .tarjeta { 
            background: transparent; 
            cursor: pointer; 
            transition: transform 0.2s; 
        }

        .tarjeta:hover {
            transform: scale(1.02);
        }

        .tarjeta img { 
            width: 100%; 
            border-radius: 4px; /* YT usa bordes muy sutiles */
            aspect-ratio: 1/1; 
            object-fit: cover; 
            margin-bottom: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .titulo { 
            font-weight: 500; 
            font-size: 15px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            margin-bottom: 4px; 
        }

        .artista { 
            color: #aaaaaa; 
            font-size: 14px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }

        /* Reproductor Fijo Inferior (El corazón de la App) */
        .reproductor-flotante { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            height: 72px;
            background: #212121; 
            display: flex; 
            align-items: center; 
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 1000;
        }

        /* Info de la pista a la izquierda */
        .info-reproduccion { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            width: 30%; 
            min-width: 200px;
        }

        .info-reproduccion img {
            width: 40px;
            height: 40px;
            border-radius: 2px;
            object-fit: cover;
            display: none; /* Se muestra con JS al reproducir */
        }

        .textos-reproductor {
            display: flex;
            flex-direction: column;
        }

        .rep-titulo { font-size: 14px; font-weight: 500; }
        .rep-artista { font-size: 12px; color: #aaaaaa; }

        /* Controles de audio en el centro */
        .controles-audio {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        audio { 
            width: 100%; 
            max-width: 600px; 
            height: 40px;
            outline: none; 
        }

        /* Ajustes de color para el reproductor nativo (Chrome/Safari) */
        audio::-webkit-media-controls-panel {
            background-color: #212121;
        }
        audio::-webkit-media-controls-play-button,
        audio::-webkit-media-controls-mute-button {
            filter: invert(1);
        }
        audio::-webkit-media-controls-current-time-display,
        audio::-webkit-media-controls-time-remaining-display {
            color: white;
        }

        /* Responsividad para móviles */
        @media (max-width: 600px) {
            .header { flex-direction: column; gap: 15px; padding: 15px; }
            .search-box { max-width: 100%; width: 100%; }
            .info-reproduccion { display: none; /* Ocultamos textos en móvil para dejar espacio al audio */ }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">
            <div style="width: 24px; height: 24px; background: #ff0000; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                <div style="width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 8px solid white; margin-left: 2px;"></div>
            </div>
            FamiMusic
        </div>
        <div class="search-box">
            <input type="text" id="inputBuscar" placeholder="Buscar canciones, álbumes, artistas" onkeypress="if(event.key === 'Enter') buscarMusica()">
            <button onclick="buscarMusica()">Buscar</button>
        </div>
    </div>

    <div class="resultados" id="contenedorResultados">
        <div style="grid-column: 1/-1; text-align: center; color: #aaaaaa; margin-top: 40px;">
            <svg style="width: 64px; height: 64px; opacity: 0.5; margin-bottom: 10px;" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
            <h2>Explora tu música</h2>
        </div>
    </div>

    <div class="reproductor-flotante">
        <div class="info-reproduccion">
            <img id="imgReproductor" src="" alt="Portada">
            <div class="textos-reproductor">
                <span class="rep-titulo" id="tituloReproductor">Nada en reproducción</span>
                <span class="rep-artista" id="artistaReproductor">---</span>
            </div>
        </div>
        <div class="controles-audio">
            <audio id="reproductor" controls autoplay></audio>
        </div>
    </div>

    <script>
        const audio = document.getElementById('reproductor');
        const contenedorResultados = document.getElementById('contenedorResultados');

        // Para actualizar el mini-reproductor
        const imgRep = document.getElementById('imgReproductor');
        const titRep = document.getElementById('tituloReproductor');
        const artRep = document.getElementById('artistaReproductor');

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }

        async function buscarMusica() {
            const query = document.getElementById('inputBuscar').value;
            if (!query) return;

            contenedorResultados.innerHTML = `<p style="text-align: center; color: #aaaaaa; grid-column: 1/-1; margin-top: 40px;">Buscando...</p>`;

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const canciones = await response.json();

                if (canciones.length === 0) {
                    contenedorResultados.innerHTML = `<p style="text-align: center; color: #aaaaaa; grid-column: 1/-1; margin-top: 40px;">No se encontró nada.</p>`;
                    return;
                }

                contenedorResultados.innerHTML = canciones.map(song => `
                    <div class="tarjeta" onclick="reproducir('${song.url}', '${song.titulo.replace(/'/g, "\\'")}', '${song.artista.replace(/'/g, "\\'")}', '${song.imagen}')">
                        <img src="${song.imagen}?width=300" alt="Portada" loading="lazy">
                        <div class="titulo">${song.titulo}</div>
                        <div class="artista">${song.artista}</div>
                    </div>
                `).join('');

            } catch (error) {
                contenedorResultados.innerHTML = `<p style="text-align: center; color: #ff4444; grid-column: 1/-1; margin-top: 40px;">Error de conexión.</p>`;
            }
        }

        function reproducir(urlOriginal, titulo, artista, portada) {
            // Actualizar la interfaz del reproductor inferior
            imgRep.src = portada;
            imgRep.style.display = 'block';
            titRep.textContent = titulo;
            artRep.textContent = artista;
            
            const urlApi = `/api/stream?url=${encodeURIComponent(urlOriginal)}`;
            audio.src = urlApi;
            audio.play();

            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: titulo,
                    artist: artista,
                    album: 'FamiMusic',
                    artwork: [ { src: portada, sizes: '512x512', type: 'image/jpeg' } ]
                });
            }
        }
    </script>
</body>
</html>
