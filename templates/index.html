<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FamiMusic</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#030303">
    <style>
        body { margin: 0; padding: 0; background-color: #030303; color: #ffffff; font-family: 'Roboto', -apple-system, sans-serif; padding-bottom: 90px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #030303; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 8px; letter-spacing: -0.5px; }
        .search-box { display: flex; flex: 1; max-width: 400px; background: #212121; border-radius: 8px; padding: 2px; border: 1px solid #303030; }
        .search-box input { flex: 1; background: transparent; border: none; padding: 10px 15px; color: white; font-size: 16px; outline: none; }
        .search-box button { background: transparent; border: none; color: #aaaaaa; padding: 0 15px; cursor: pointer; font-weight: bold; transition: color 0.2s; }
        .search-box button:hover { color: #ffffff; }
        
        .resultados { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 24px; padding: 30px; max-width: 1200px; margin: 0 auto; }
        .tarjeta { background: transparent; cursor: pointer; transition: transform 0.2s; }
        .tarjeta:hover { transform: scale(1.02); }
        .tarjeta img { width: 100%; border-radius: 4px; aspect-ratio: 1/1; object-fit: cover; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .titulo { font-weight: 500; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .artista { color: #aaaaaa; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .reproductor-flotante { position: fixed; bottom: 0; left: 0; right: 0; height: 72px; background: #212121; display: flex; align-items: center; padding: 0 20px; box-sizing: border-box; z-index: 1000; border-top: 1px solid #303030; }
        .info-reproduccion { display: flex; align-items: center; gap: 15px; width: 30%; min-width: 200px; }
        .info-reproduccion img { width: 40px; height: 40px; border-radius: 2px; object-fit: cover; display: none; }
        .textos-reproductor { display: flex; flex-direction: column; }
        .rep-titulo { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
        .rep-artista { font-size: 12px; color: #aaaaaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
        
        .controles-audio { flex: 1; display: flex; justify-content: center; align-items: center; }
        audio { width: 100%; max-width: 600px; height: 40px; outline: none; }
        audio::-webkit-media-controls-panel { background-color: #212121; }
        audio::-webkit-media-controls-play-button, audio::-webkit-media-controls-mute-button { filter: invert(1); }
        audio::-webkit-media-controls-current-time-display, audio::-webkit-media-controls-time-remaining-display { color: white; }

        #estado { grid-column: 1/-1; text-align: center; color: #aaaaaa; margin-top: 40px; }

        @media (max-width: 600px) {
            .header { flex-direction: column; gap: 15px; padding: 15px; }
            .search-box { max-width: 100%; width: 100%; }
            .info-reproduccion { display: none; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">
            <div style="width: 24px; height: 24px; background: #ff0000; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                <div style="width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 8px solid white; margin-left: 2px;"></div>
            </div>
            FamiMusic
        </div>
        <div class="search-box">
            <input type="text" id="inputBuscar" placeholder="Buscar canciones comerciales..." onkeypress="if(event.key === 'Enter') buscarMusica()">
            <button onclick="buscarMusica()">Buscar</button>
        </div>
    </div>

    <div class="resultados" id="contenedorResultados">
        <div id="estado"><h2>Explora tu música</h2></div>
    </div>

    <div class="reproductor-flotante">
        <div class="info-reproduccion">
            <img id="imgReproductor" src="" alt="Portada">
            <div class="textos-reproductor">
                <span class="rep-titulo" id="tituloReproductor">Nada en reproducción</span>
                <span class="rep-artista" id="artistaReproductor">---</span>
            </div>
        </div>
        <div class="controles-audio">
            <audio id="reproductor" controls autoplay></audio>
        </div>
    </div>

    <script>
        const audio = document.getElementById('reproductor');
        const contenedorResultados = document.getElementById('contenedorResultados');
        const imgRep = document.getElementById('imgReproductor');
        const titRep = document.getElementById('tituloReproductor');
        const artRep = document.getElementById('artistaReproductor');

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(err => console.warn('PWA no activa:', err));
        }

        // FUNCION FRANCOTIRADOR: Corta la conexión si el servidor tarda más de 4 segundos
        async function fetchRapido(url) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), 4000); 
            try {
                const response = await fetch(url, { signal: controller.signal });
                clearTimeout(id);
                return response;
            } catch (error) {
                clearTimeout(id);
                throw error;
            }
        }

        // MOTOR 1: EL CATÁLOGO (Apple Music)
        async function buscarMusica() {
            const query = document.getElementById('inputBuscar').value;
            if (!query) return;

            contenedorResultados.innerHTML = `<div id="estado">Buscando...</div>`;

            try {
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=24`);
                const data = await response.json();
                
                if (!data.results || data.results.length === 0) {
                    contenedorResultados.innerHTML = `<div id="estado">No se encontró la canción.</div>`;
                    return;
                }

                contenedorResultados.innerHTML = data.results.map(song => {
                    const portadaHD = song.artworkUrl100.replace('100x100bb', '512x512bb');
                    const tituloLimpio = song.trackName.replace(/'/g, "\\'");
                    const artistaLimpio = song.artistName.replace(/'/g, "\\'");
                    
                    return `
                        <div class="tarjeta" onclick="reproducir('${tituloLimpio}', '${artistaLimpio}', '${portadaHD}')">
                            <img src="${portadaHD}" alt="Portada" loading="lazy">
                            <div class="titulo">${song.trackName}</div>
                            <div class="artista">${song.artistName}</div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                contenedorResultados.innerHTML = `<div id="estado" style="color: #ff4444;">Error de red al buscar.</div>`;
            }
        }

        // MOTOR 2: EXTRACCIÓN CON TIMEOUT (Red Invidious)
        async function reproducir(titulo, artista, portada) {
            imgRep.src = portada;
            imgRep.style.display = 'block';
            titRep.textContent = "Conectando al servidor...";
            artRep.textContent = artista;
            
            audio.pause();
            audio.removeAttribute('src');
            
            // Servidores Invidious públicos y súper rápidos
            const invidiousNodes = [
                "https://invidious.nerdvpn.de",
                "https://inv.tux.pizza",
                "https://invidious.fdn.fr",
                "https://invidious.slipfox.xyz"
            ];

            let audioEncontrado = false;
            const busquedaExacta = `${artista} ${titulo} audio`;

            for (let api of invidiousNodes) {
                try {
                    // Usamos fetchRapido: si este nodo se tarda más de 4 segs, lo saltamos.
                    const searchRes = await fetchRapido(`${api}/api/v1/search?q=${encodeURIComponent(busquedaExacta)}&type=video`);
                    if (!searchRes.ok) continue;
                    
                    const searchData = await searchRes.json();
                    
                    if (searchData && searchData.length > 0) {
                        const videoId = searchData[0].videoId;
                        
                        // itag=140 es la bóveda del audio puro M4A de YouTube
                        const audioUrl = `${api}/latest_version?id=${videoId}&itag=140`;
                        
                        audio.src = audioUrl;
                        audio.play();
                        audioEncontrado = true;
                        
                        titRep.textContent = titulo;

                        if ('mediaSession' in navigator) {
                            navigator.mediaSession.metadata = new MediaMetadata({
                                title: titulo,
                                artist: artista,
                                album: 'FamiMusic',
                                artwork: [ { src: portada, sizes: '512x512', type: 'image/jpeg' } ]
                            });
                        }
                        break; 
                    }
                } catch (error) {
                    console.warn("Servidor lento ignorado, pasando al siguiente...");
                }
            }

            if (!audioEncontrado) {
                titRep.textContent = "Servidores llenos";
                alert("Todos los servidores están súper ocupados ahora mismo. Intenta darle play de nuevo.");
            }
        }
    </script>
</body>
</html>
