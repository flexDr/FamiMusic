<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>FamiMusic — Edición Profesional</title>
    <style>
        /* ---------- RESET Y GLOBALES ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', sans-serif;
            background: #000000;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Fondo con gradiente dinámico */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(255, 45, 85, 0.25), transparent 55%),
                        radial-gradient(circle at 85% 30%, rgba(255, 179, 71, 0.2), transparent 60%),
                        radial-gradient(circle at 40% 80%, rgba(138, 43, 226, 0.15), transparent 50%);
            background-blend-mode: overlay;
            animation: auraBreathing 8s ease infinite alternate;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes auraBreathing {
            0% { opacity: 0.6; filter: blur(45px); }
            100% { opacity: 1; filter: blur(55px); }
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            z-index: 1;
        }

        /* ---------- SIDEBAR (ESCRITORIO) ---------- */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 280px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(30px);
            padding: 28px 20px;
            border-right: 1px solid rgba(255,255,255,0.08);
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            z-index: 20;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 40px;
            background: linear-gradient(135deg, #ff2d55, #ffb347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin-bottom: 40px;
        }

        .nav-links a, .playlists li {
            display: flex;
            align-items: center;
            gap: 14px;
            color: #ddd;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: 0.2s;
            cursor: pointer;
            padding: 6px 0;
        }

        .nav-links a.active, .nav-links a:hover, .playlists li:hover {
            color: #ff2d55;
        }

        .search-box {
            margin: 20px 0 30px;
        }

        .search-box input {
            width: 100%;
            background: rgba(255,255,255,0.12);
            border: none;
            padding: 14px 18px;
            border-radius: 40px;
            color: white;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
        }

        .search-box input:focus {
            background: rgba(255,255,255,0.2);
        }

        .playlists {
            margin-top: 20px;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
            margin-bottom: 16px;
        }

        /* ---------- CONTENIDO PRINCIPAL ---------- */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 20px 100px;
            scroll-behavior: smooth;
        }

        /* Encabezado móvil (solo se ve en mobile) */
        .mobile-header {
            display: none;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 15;
        }

        .menu-icon {
            font-size: 28px;
            cursor: pointer;
        }

        .mobile-logo {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff2d55, #ffb347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Hero */
        .hero h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .hero p {
            color: #bbb;
            font-size: 0.9rem;
        }

        /* Secciones estilo Apple Music */
        .section {
            margin: 32px 0 28px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 18px;
        }

        .section-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .section-header a {
            color: #ff2d55;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* Grid horizontal (scroll móvil) y grid normal */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .horizontal-scroll {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding-bottom: 12px;
        }

        .horizontal-scroll .music-card {
            flex: 0 0 150px;
            scroll-snap-align: start;
        }

        .music-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 12px;
            transition: transform 0.25s, background 0.2s;
            cursor: pointer;
        }

        .music-card:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-4px);
        }

        .card-img {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
        }

        .card-img img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 12px;
        }

        .play-btn-overlay {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: #ff2d55;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
        }

        .music-card:hover .play-btn-overlay {
            opacity: 1;
        }

        .card-info {
            margin-top: 12px;
        }

        .card-title {
            font-weight: 600;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-sub {
            font-size: 0.7rem;
            color: #aaa;
            margin-top: 4px;
        }

        /* ---------- REPRODUCTOR PROFESIONAL (EXPANDIBLE) ---------- */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(20, 20, 30, 0.95);
            backdrop-filter: blur(30px);
            border-top: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px 20px 0 0;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            z-index: 100;
            transform: translateY(0);
        }

        /* Estado expandido (subir) */
        .player-bar.expanded {
            transform: translateY(-60%);
            background: rgba(10, 10, 15, 0.98);
            border-radius: 30px 30px 0 0;
            padding-bottom: 30px;
        }

        .player-mini {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            cursor: pointer;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
        }

        .player-info img {
            width: 48px;
            height: 48px;
            border-radius: 12px;
        }

        .track-title {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .track-artist {
            font-size: 0.7rem;
            color: #aaa;
        }

        .player-controls-mini {
            display: flex;
            gap: 18px;
            align-items: center;
        }

        .player-controls-mini button {
            background: none;
            border: none;
            color: white;
            font-size: 1.4rem;
            cursor: pointer;
        }

        /* Contenido expandido */
        .player-expanded {
            display: none;
            padding: 20px 24px 30px;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .player-bar.expanded .player-expanded {
            display: flex;
        }

        .expanded-artwork {
            width: 280px;
            height: 280px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            margin: 20px 0;
        }

        .expanded-info {
            text-align: center;
        }

        .expanded-info .title {
            font-size: 1.6rem;
            font-weight: 700;
        }

        .expanded-info .artist {
            color: #aaa;
            margin-top: 6px;
        }

        .expanded-controls {
            display: flex;
            gap: 32px;
            align-items: center;
            margin: 20px 0;
        }

        .expanded-controls button {
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .expanded-controls button:hover {
            background: rgba(255,255,255,0.1);
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            margin: 12px 0;
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            cursor: pointer;
        }

        .progress-filled {
            width: 0%;
            height: 100%;
            background: #ff2d55;
            border-radius: 4px;
        }

        .time {
            font-size: 0.7rem;
            color: #aaa;
        }

        /* ---------- MENÚ INFERIOR MÓVIL ---------- */
        .mobile-tab-bar {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(18, 18, 28, 0.9);
            backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255,255,255,0.08);
            padding: 8px 24px;
            justify-content: space-around;
            z-index: 99;
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #aaa;
            cursor: pointer;
            transition: color 0.2s;
            font-size: 0.7rem;
        }

        .tab-item.active, .tab-item:hover {
            color: #ff2d55;
        }

        .tab-item svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 768px) {
            .sidebar {
                width: 260px;
            }
            .mobile-header {
                display: flex;
            }
            .main-content {
                padding-top: 0;
                padding-bottom: 80px;
            }
            .mobile-tab-bar {
                display: flex;
            }
            .cards-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 14px;
            }
            .expanded-artwork {
                width: 220px;
                height: 220px;
            }
        }

        @media (min-width: 769px) {
            .sidebar {
                transform: translateX(0) !important;
            }
            .mobile-header, .menu-icon {
                display: none;
            }
            .mobile-tab-bar {
                display: none;
            }
            .main-content {
                margin-left: 280px;
                padding: 30px 40px 100px;
            }
            .player-bar.expanded {
                transform: translateY(-50%);
            }
        }

        /* Scrolls bonitos */
        .horizontal-scroll::-webkit-scrollbar {
            height: 4px;
        }
        .horizontal-scroll::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
        }
        .horizontal-scroll::-webkit-scrollbar-thumb {
            background: #ff2d55;
            border-radius: 10px;
        }
        .main-content::-webkit-scrollbar {
            width: 5px;
        }
        .main-content::-webkit-scrollbar-thumb {
            background: #ff2d55;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="app">

    <!-- Header móvil -->

    <!-- Contenido principal -->
    <main class="main-content" id="mainContent"></main>

    <!-- Reproductor expandible profesional -->

<!-- Modal de video (sencillo) -->
<div id="videoModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; justify-content: center; align-items: center;">
    <div style="position: relative; width: 90%; max-width: 800px;">
        <button id="closeVideoBtn" style="position: absolute; top: -40px; right: 0; background: none; border: none; color: white; font-size: 28px; cursor: pointer;">✕</button>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
    // ---------- GLOBALES ----------
    let player;
    let currentQueue = [];
    let currentIndex = 0;
    let isPlaying = false;
    let currentSongData = null;
    let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
    let progressInterval = null;

    // Elementos
    const playerBar = document.getElementById('playerBar');
    const miniPlayPause = document.getElementById('miniPlayPause');
    const playPauseExp = document.getElementById('playPauseExp');
    const prevBtnExp = document.getElementById('prevBtnExp');
    const nextBtnExp = document.getElementById('nextBtnExp');
    const expandBtn = document.getElementById('expandBtn');
    const progressBarDiv = document.getElementById('progressBar');
    const progressFilled = document.getElementById('progressFilled');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('duration');
    const videoModal = document.getElementById('videoModal');
    const videoIframe = document.getElementById('videoIframe');
    const closeVideoBtn = document.getElementById('closeVideoBtn');
    const videoBtnExp = document.getElementById('videoBtnExp');
    const sidebar = document.getElementById('sidebar');
    const menuIcon = document.getElementById('menuIcon');

    // ========== YOUTUBE PLAYER ==========
    function onYouTubeIframeAPIReady() {
        player = new YT.Player('youtube-player', {
            height: '0', width: '0',
            playerVars: { autoplay: 0, controls: 0, modestbranding: 1, rel: 0, enablejsapi: 1, mute: 1 },
            events: {
                onReady: () => console.log("Player listo"),
                onStateChange: onPlayerStateChange,
                onError: (e) => console.error("Error player", e)
            }
        });
    }

    function onPlayerStateChange(event) {
        if (event.data === YT.PlayerState.PLAYING) {
            isPlaying = true;
            updatePlayButtons('⏸️');
            startProgressUpdate();
        } else if (event.data === YT.PlayerState.PAUSED) {
            isPlaying = false;
            updatePlayButtons('▶️');
            stopProgressUpdate();
        } else if (event.data === YT.PlayerState.ENDED) {
            nextSong();
        }
    }

    function updatePlayButtons(icon) {
        miniPlayPause.innerHTML = icon;
        playPauseExp.innerHTML = icon;
    }

    function startProgressUpdate() {
        if (progressInterval) clearInterval(progressInterval);
        progressInterval = setInterval(() => {
            if (player && player.getCurrentTime && isPlaying) {
                const current = player.getCurrentTime();
                const duration = player.getDuration();
                if (duration) {
                    const percent = (current / duration) * 100;
                    progressFilled.style.width = `${percent}%`;
                    currentTimeSpan.textContent = formatTime(current);
                    durationSpan.textContent = formatTime(duration);
                }
            }
        }, 500);
    }

    function stopProgressUpdate() {
        if (progressInterval) clearInterval(progressInterval);
    }

    function formatTime(sec) {
        if (isNaN(sec)) return "0:00";
        const mins = Math.floor(sec / 60);
        const secs = Math.floor(sec % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // ========== REPRODUCCIÓN Y COLA ==========
    function playSong(videoId, title, thumb, addToQueue = true, replaceQueue = false) {
        if (!player) return;
        if (replaceQueue) {
            currentQueue = [{ id: videoId, title, thumb }];
            currentIndex = 0;
        } else if (addToQueue) {
            const exists = currentQueue.findIndex(s => s.id === videoId);
            if (exists !== -1) currentIndex = exists;
            else {
                currentQueue.push({ id: videoId, title, thumb });
                currentIndex = currentQueue.length - 1;
            }
        }
        currentSongData = currentQueue[currentIndex];
        // Actualizar UI del reproductor
        playerBar.style.display = 'block';
        document.getElementById('miniTitle').innerHTML = currentSongData.title;
        document.getElementById('miniThumb').src = currentSongData.thumb;
        document.getElementById('expTitle').innerHTML = currentSongData.title;
        document.getElementById('expandedArtwork').src = currentSongData.thumb;
        player.loadVideoById({ videoId: currentSongData.id, startSeconds: 0 });
        player.unMute();
    }

    function nextSong() {
        if (currentQueue.length === 0) return;
        currentIndex = (currentIndex + 1) % currentQueue.length;
        const next = currentQueue[currentIndex];
        playSong(next.id, next.title, next.thumb, false);
    }

    function prevSong() {
        if (currentQueue.length === 0) return;
        currentIndex = (currentIndex - 1 + currentQueue.length) % currentQueue.length;
        const prev = currentQueue[currentIndex];
        playSong(prev.id, prev.title, prev.thumb, false);
    }

    // ========== VIDEO MODAL ==========
    function showVideo() {
        if (!currentSongData) return;
        videoIframe.src = `https://www.youtube.com/embed/${currentSongData.id}?autoplay=1&enablejsapi=1`;
        videoModal.style.display = 'flex';
    }
    videoBtnExp.addEventListener('click', showVideo);
    closeVideoBtn.addEventListener('click', () => {
        videoModal.style.display = 'none';
        videoIframe.src = '';
    });
    window.addEventListener('click', (e) => { if (e.target === videoModal) closeVideoBtn.click(); });

    // ========== FAVORITOS ==========
    function toggleFavorite() {
        if (!currentSongData) return;
        const idx = favorites.findIndex(f => f.id === currentSongData.id);
        if (idx === -1) favorites.push(currentSongData);
        else favorites.splice(idx, 1);
        localStorage.setItem('favorites', JSON.stringify(favorites));
    }

    // ========== BACKEND ==========
    async function fetchSongs(query) {
        try {
            const res = await fetch(`/search/${encodeURIComponent(query)}`);
            if (!res.ok) return [];
            const data = await res.json();
            return Array.isArray(data) ? data : [];
        } catch (err) { return []; }
    }

    // ========== RENDERIZADO CON SECCIONES (Sugerencias, Recientes) ==========
    async function loadHome() {
        const main = document.getElementById('mainContent');
        main.innerHTML = `
            <div class="hero"><h1>Buenas noches</h1><p>Música sin límites</p></div>
            <div class="section"><div class="section-header"><h2>Sugerencias destacadas para ti</h2><a href="#">Ver todo</a></div><div class="horizontal-scroll" id="suggestionsGrid"></div></div>
            <div class="section"><div class="section-header"><h2>Escuchado recientemente</h2><a href="#">Ver todo</a></div><div class="horizontal-scroll" id="recentGrid"></div></div>
            <div class="section"><div class="section-header"><h2>Recomendado para ti</h2><a href="#">Ver todo</a></div><div class="cards-grid" id="homeGrid"></div></div>
        `;
        const suggestions = await fetchSongs('exitos 2025');
        const recent = await fetchSongs('pop hits');
        const recommended = await fetchSongs('música popular');
        renderHorizontalScroll(suggestions.slice(0, 10), 'suggestionsGrid');
        renderHorizontalScroll(recent.slice(0, 10), 'recentGrid');
        renderCards(recommended, 'homeGrid');
    }

    function renderHorizontalScroll(songs, containerId) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';
        songs.forEach(song => {
            const card = document.createElement('div');
            card.className = 'music-card';
            card.innerHTML = `
                <div class="card-img"><img src="${song.thumb}"><button class="play-btn-overlay" data-id="${song.id}" data-title="${escapeHtml(song.title)}" data-thumb="${song.thumb}">▶</button></div>
                <div class="card-info"><div class="card-title">${escapeHtml(song.title)}</div><div class="card-sub">Artista</div></div>
            `;
            container.appendChild(card);
        });
        attachPlayEvents();
    }

    function renderCards(songs, containerId) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';
        songs.forEach(song => {
            const card = document.createElement('div');
            card.className = 'music-card';
            card.innerHTML = `
                <div class="card-img"><img src="${song.thumb}"><button class="play-btn-overlay" data-id="${song.id}" data-title="${escapeHtml(song.title)}" data-thumb="${song.thumb}">▶</button></div>
                <div class="card-info"><div class="card-title">${escapeHtml(song.title)}</div><div class="card-sub">Artista</div></div>
            `;
            container.appendChild(card);
        });
        attachPlayEvents();
    }

    function attachPlayEvents() {
        document.querySelectorAll('.play-btn-overlay').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                playSong(btn.dataset.id, btn.dataset.title, btn.dataset.thumb, true, true);
            });
        });
    }

    async function loadExplore() {
        const main = document.getElementById('mainContent');
        main.innerHTML = `<div class="section-header"><h2>Explorar</h2></div><div class="cards-grid" id="exploreGrid"></div>`;
        const songs = await fetchSongs('exitos 2025');
        renderCards(songs, 'exploreGrid');
    }
    async function loadRadio() {
        const main = document.getElementById('mainContent');
        main.innerHTML = `<div class="section-header"><h2>Radio FamiMusic</h2></div><div class="cards-grid" id="radioGrid"></div>`;
        const songs = await fetchSongs('random mix');
        renderCards(songs, 'radioGrid');
    }
    async function loadMixDiaria() {
        const main = document.getElementById('mainContent');
        main.innerHTML = `<div class="section-header"><h2>Mezcla diaria</h2></div><div class="cards-grid" id="mixGrid"></div>`;
        const songs = await fetchSongs('daily mix');
        renderCards(songs, 'mixGrid');
    }
    async function loadDriving() {
        const main = document.getElementById('mainContent');
        main.innerHTML = `<div class="section-header"><h2>Conducción</h2></div><div class="cards-grid" id="drivingGrid"></div>`;
        const songs = await fetchSongs('driving music');
        renderCards(songs, 'drivingGrid');
    }
    function loadFavoritesView() {
        const main = document.getElementById('mainContent');
        main.innerHTML = `<div class="section-header"><h2>Favoritos</h2></div><div class="cards-grid" id="favGrid"></div>`;
        renderCards(favorites, 'favGrid');
    }
    async function performSearch(query) {
        const main = document.getElementById('mainContent');
        main.innerHTML = `<div class="section-header"><h2>Resultados: "${escapeHtml(query)}"</h2></div><div class="cards-grid" id="searchGrid"></div>`;
        const songs = await fetchSongs(query);
        renderCards(songs, 'searchGrid');
    }

    // ========== EVENTOS UI ==========
    function setupEvents() {
        // Navegación
        const loadSection = (section) => {
            if (section === 'home') loadHome();
            else if (section === 'explore') loadExplore();
            else if (section === 'radio') loadRadio();
            document.querySelectorAll('.nav-links a, .tab-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll(`.nav-links a[data-section="${section}"], .tab-item[data-section="${section}"]`).forEach(el => el.classList.add('active'));
            if (sidebar.classList.contains('open')) sidebar.classList.remove('open');
        };
        document.querySelectorAll('.nav-links a, .tab-item').forEach(el => {
            el.addEventListener('click', (e) => {
                e.preventDefault();
                const section = el.dataset.section;
                if (section) loadSection(section);
                const playlist = el.dataset.playlist;
                if (playlist === 'favorites') loadFavoritesView();
                else if (playlist === 'mix') loadMixDiaria();
                else if (playlist === 'driving') loadDriving();
            });
        });
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch(e.target.value.trim());
        });
        // Controles del reproductor
        miniPlayPause.addEventListener('click', (e) => { e.stopPropagation(); if (isPlaying) player.pauseVideo(); else player.playVideo(); });
        playPauseExp.addEventListener('click', () => { if (isPlaying) player.pauseVideo(); else player.playVideo(); });
        prevBtnExp.addEventListener('click', prevSong);
        nextBtnExp.addEventListener('click', nextSong);
        progressBarDiv.addEventListener('click', (e) => {
            if (!player || !player.getDuration) return;
            const rect = progressBarDiv.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            const duration = player.getDuration();
            if (duration) player.seekTo(percent * duration, true);
        });
        // Expandir reproductor
        expandBtn.addEventListener('click', () => {
            playerBar.classList.toggle('expanded');
        });
        // Sidebar móvil
        menuIcon.addEventListener('click', () => {
            sidebar.classList.toggle('open');
        });
        // Cerrar sidebar al hacer clic fuera (móvil)
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 768 && sidebar.classList.contains('open') && !sidebar.contains(e.target) && !menuIcon.contains(e.target)) {
                sidebar.classList.remove('open');
            }
        });
    }

    function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

    window.onload = () => {
        setupEvents();
        loadHome();
    };
</script>
</body>
</html>
