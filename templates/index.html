<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicAPI Premium</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#09090b">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #09090b;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        h1 {
            color: #8b5cf6;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 0 0 15px rgba(139, 92, 246, 0.5);
        }
        input[type="text"] {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #27272a;
            background: #18181b;
            color: white;
            font-size: 16px;
            margin-bottom: 20px;
            box-sizing: border-box;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #8b5cf6;
        }
        button {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        #reproductor {
            width: 100%;
            margin-top: 30px;
            border-radius: 30px;
            outline: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MusicAPI</h1>
        
        <input type="text" id="inputBusqueda" placeholder="Pega un enlace de YouTube aquí...">
        <button onclick="iniciarReproduccion()">Reproducir Canción</button>

        <audio id="reproductor" controls></audio>
    </div>

    <script>
        function iniciarReproduccion() {
            const url = document.getElementById('inputBusqueda').value;
            if (url) {
                // Llama a la función maestra que está en tu app.js
                // Pasamos datos genéricos por ahora para la pantalla de bloqueo
                reproducirCancion(url, "En reproducción", "MusicAPI", "https://cdn-icons-png.flaticon.com/512/3669/3669483.png");
            } else {
                alert("Por favor, pega un enlace primero.");
            }
        }
    </script>

    <script src="/static/app.js"></script>
</body>
</html>
