<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FamiMusic</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#030303">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030303;
            --surface: #121212;
            --surface2: #1e1e1e;
            --border: rgba(255,255,255,0.08);
            --accent: #ff3333;
            --accent-glow: rgba(255,51,51,0.2);
            --text: #ffffff;
            --text-muted: #aaaaaa;
            --player-h: 80px;
            --r: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            padding-bottom: calc(var(--player-h) + 10px);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            position: sticky; top: 0; z-index: 200;
            background: rgba(3,3,3,0.92);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px; display: flex; align-items: center; gap: 20px;
        }

        .logo {
            display: flex; align-items: center; gap: 10px;
            font-size: 1.15rem; font-weight: 700; letter-spacing: -0.3px;
            white-space: nowrap; flex-shrink: 0; text-decoration: none; color: var(--text);
        }

        .logo-icon {
            width: 32px; height: 32px; background: var(--accent); border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; box-shadow: 0 0 16px var(--accent-glow);
        }

        .search-wrap { flex: 1; max-width: 500px; position: relative; }

        .search-input {
            width: 100%; background: var(--surface2); border: 1px solid var(--border);
            border-radius: 24px; padding: 10px 48px 10px 20px;
            color: var(--text); font-size: 14px; font-family: inherit; outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: rgba(255,255,255,0.25);
            box-shadow: 0 0 0 3px rgba(255,255,255,0.04);
        }

        .search-input::placeholder { color: var(--text-muted); }

        .search-btn {
            position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
            background: var(--accent); border: none; border-radius: 50%;
            width: 32px; height: 32px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.2s, transform 0.15s;
        }
        .search-btn:hover { opacity: 0.85; transform: translateY(-50%) scale(1.05); }
        .search-btn:active { transform: translateY(-50%) scale(0.95); }

        /* ===== GENRE CHIPS ===== */
        .genres { display: flex; gap: 8px; padding: 14px 24px; overflow-x: auto; scrollbar-width: none; }
        .genres::-webkit-scrollbar { display: none; }

        .chip {
            flex-shrink: 0; background: var(--surface2); border: 1px solid var(--border);
            border-radius: 20px; padding: 6px 16px; font-size: 13px; font-family: inherit;
            cursor: pointer; transition: all 0.2s; color: var(--text-muted); white-space: nowrap;
        }
        .chip:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
        .chip.active {
            background: var(--accent); border-color: var(--accent); color: #fff;
            font-weight: 500; box-shadow: 0 0 12px var(--accent-glow);
        }

        /* ===== GRID & CARDS ===== */
        .section-title { padding: 4px 24px 14px; font-size: 18px; font-weight: 600; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 18px; padding: 0 24px 24px; }
        
        .card { cursor: pointer; border-radius: var(--r); transition: transform 0.2s; }
        .card:hover { transform: scale(1.03); }
        .card:active { transform: scale(0.98); }

        .card-img-wrap { position: relative; border-radius: var(--r); overflow: hidden; margin-bottom: 10px; }
        .card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--surface2); }

        .card-play-btn {
            position: absolute; bottom: 8px; right: 8px; width: 40px; height: 40px;
            background: var(--accent); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; opacity: 0;
            transition: opacity 0.2s, transform 0.2s; transform: translateY(6px); box-shadow: 0 4px 16px rgba(0,0,0,0.6);
        }
        .card:hover .card-play-btn { opacity: 1; transform: translateY(0); }

        .card-title { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
        .card-artist { color: var(--text-muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card.playing .card-img-wrap::after {
            content: ''; position: absolute; inset: 0; background: var(--accent-glow);
            border: 2px solid var(--accent); border-radius: var(--r); pointer-events: none;
        }
        .card.playing .card-title { color: var(--accent); }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state h3 { font-size: 18px; margin-bottom: 8px; color: var(--text); }
        .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.08); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== PLAYER ===== */
        .player { position: fixed; bottom: 0; left: 0; right: 0; height: var(--player-h); background: var(--surface); border-top: 1px solid var(--border); z-index: 300; display: flex; flex-direction: column; }
        .progress-wrap { height: 3px; background: var(--surface2); cursor: pointer; position: relative; }
        .progress-wrap:hover { height: 5px; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.1s linear; pointer-events: none; }
        .progress-fill::after { content: ''; position: absolute; right: -5px; top: 50%; transform: translateY(-50%); width: 10px; height: 10px; background: var(--accent); border-radius: 50%; opacity: 0; transition: opacity 0.15s; }
        .progress-wrap:hover .progress-fill::after { opacity: 1; }

        .player-inner { flex: 1; display: flex; align-items: center; padding: 0 20px; gap: 16px; }
        .track-info { display: flex; align-items: center; gap: 12px; width: 260px; min-width: 0; flex-shrink: 0; }
        .track-thumb { width: 46px; height: 46px; border-radius: 4px; object-fit: cover; flex-shrink: 0; background: var(--surface2); }
        .track-thumb.hidden { display: none; }
        .track-placeholder { width: 46px; height: 46px; border-radius: 4px; background: var(--surface2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .track-texts { min-width: 0; }
        .track-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

        .controls { flex: 1; display: flex; align-items: center; justify-content: center; gap: 18px; }
        .ctrl-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: color 0.15s, background 0.15s, transform 0.15s; }
        .ctrl-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }
        .ctrl-btn:active { transform: scale(0.9); }
        .ctrl-btn.play-btn { background: #fff; color: #000; width: 42px; height: 42px; }
        .ctrl-btn.play-btn:hover { background: #eee; }
        .time-disp { font-size: 11px; color: var(--text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

        .player-extras { display: flex; align-items: center; gap: 10px; width: 200px; justify-content: flex-end; flex-shrink: 0; }
        .vol-wrap { display: flex; align-items: center; gap: 8px; }
        input[type="range"] { -webkit-appearance: none; width: 80px; height: 3px; background: var(--surface2); border-radius: 3px; outline: none; cursor: pointer; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: #fff; border-radius: 50%; }

        .queue-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 250; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .queue-overlay.open { opacity: 1; pointer-events: all; }
        .queue-panel { position: fixed; right: 0; top: 0; bottom: var(--player-h); width: 320px; background: var(--surface); border-left: 1px solid var(--border); z-index: 251; transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); display: flex; flex-direction: column; }
        .queue-panel.open { transform: translateX(0); }
        .queue-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .queue-header h3 { font-size: 15px; font-weight: 600; }
        .queue-count { font-size: 12px; color: var(--text-muted); background: var(--surface2); padding: 2px 8px; border-radius: 10px; }
        .queue-list { flex: 1; overflow-y: auto; padding: 6px 0; scrollbar-width: thin; scrollbar-color: var(--surface2) transparent; }
        .queue-item { display: flex; align-items: center; gap: 12px; padding: 10px 20px; cursor: pointer; transition: background 0.15s; }
        .queue-item:hover { background: var(--surface2); }
        .queue-item.current { background: rgba(255,51,51,0.1); border-left: 2px solid var(--accent); padding-left: 18px; }
        .queue-item img { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
        .queue-num { width: 20px; font-size: 12px; color: var(--text-muted); text-align: center; flex-shrink: 0; }
        .queue-item.current .queue-num { color: var(--accent); }
        .qi-texts { min-width: 0; flex: 1; }
        .qi-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .qi-artist { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .queue-item.current .qi-title { color: var(--accent); }

        .toast { position: fixed; bottom: calc(var(--player-h) + 14px); left: 50%; transform: translateX(-50%) translateY(12px); background: #2a2a2a; color: #fff; padding: 9px 20px; border-radius: 24px; font-size: 13px; opacity: 0; transition: all 0.3s; pointer-events: none; white-space: nowrap; z-index: 400; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ===== EL TRUCO PARA ENGAÑAR A SAFARI ===== */
        /* Hacemos que el reproductor mida 300x300 (para que Safari no lo bloquee)
           pero lo escondemos fuera de la pantalla en la posición -9999px */
        #ytPlayerContainer {
            position: absolute;
            top: -9999px; left: -9999px;
            width: 300px; height: 300px;
            z-index: -10;
        }

        @media (max-width: 680px) {
            .header { padding: 10px 14px; gap: 12px; }
            .logo-text { display: none; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; padding: 0 14px 20px; }
            .genres { padding: 10px 14px; }
            .section-title { padding: 4px 14px 10px; font-size: 16px; }
            .track-info { width: auto; max-width: 40vw; }
            .player-extras { display: none; }
            .controls { gap: 10px; }
            .time-disp { display: none; }
            .queue-panel { width: 100%; }
        }
        @media (max-width: 400px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

<script src="https://www.youtube.com/iframe_api"></script>

<div id="ytPlayerContainer">
    <div id="ytPlayer"></div>
</div>

<header class="header">
    <a class="logo" href="/">
        <div class="logo-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M9 18V5l12-2v13" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="6" cy="18" r="3" stroke="white" stroke-width="2"/>
                <circle cx="18" cy="16" r="3" stroke="white" stroke-width="2"/>
            </svg>
        </div>
        <span class="logo-text">FamiMusic</span>
    </a>

    <div class="search-wrap">
        <input class="search-input" type="text" id="searchInput"
               placeholder="Buscar artista, canción, género..."
               onkeypress="if(event.key==='Enter') buscar()">
        <button class="search-btn" onclick="buscar()" aria-label="Buscar">
            <svg width="14" height="14" fill="none" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8" stroke="white" stroke-width="2.5"/>
                <path d="m21 21-4.35-4.35" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
        </button>
    </div>
</header>

<div class="genres" id="genreChips">
    <button class="chip active" onclick="cargarTrending(this)">🔥 Trending</button>
    <button class="chip" onclick="buscarGenero(this,'bachata 2025')">🇩🇴 Bachata</button>
    <button class="chip" onclick="buscarGenero(this,'merengue dominicano')">💃 Merengue</button>
    <button class="chip" onclick="buscarGenero(this,'dembow dominicano 2025')">🎤 Dembow</button>
    <button class="chip" onclick="buscarGenero(this,'reggaeton 2025')">🎶 Reggaeton</button>
    <button class="chip" onclick="buscarGenero(this,'salsa 2025')">🎺 Salsa</button>
    <button class="chip" onclick="buscarGenero(this,'pop en español 2025')">⭐ Pop Latino</button>
    <button class="chip" onclick="buscarGenero(this,'trap latin 2025')">🎧 Trap</button>
    <button class="chip" onclick="buscarGenero(this,'cumbia 2025')">🪗 Cumbia</button>
    <button class="chip" onclick="buscarGenero(this,'rock en español')">🎸 Rock</button>
    <button class="chip" onclick="buscarGenero(this,'bad bunny')">🐰 Bad Bunny</button>
    <button class="chip" onclick="buscarGenero(this,'romeo santos bachata')">🎸 Romeo Santos</button>
</div>

<div class="section-title" id="sectionTitle">Trending</div>
<div class="grid" id="grid">
    <div class="empty-state"><div class="spinner"></div><p>Cargando música...</p></div>
</div>

<div class="player" id="player">
    <div class="progress-wrap" id="progressWrap">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="player-inner">
        <div class="track-info">
            <img class="track-thumb hidden" id="trackThumb" src="" alt="Portada">
            <div class="track-placeholder" id="trackPlaceholder">
                <svg width="20" height="20" fill="none" viewBox="0 0 24 24">
                    <path d="M9 18V5l12-2v13" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="6" cy="18" r="3" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
                </svg>
            </div>
            <div class="track-texts">
                <div class="track-name" id="trackName">FamiMusic</div>
                <div class="track-artist" id="trackArtist">Selecciona una canción</div>
            </div>
        </div>

        <div class="controls">
            <button class="ctrl-btn" onclick="anterior()" aria-label="Anterior">
                <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
            </button>
            <button class="ctrl-btn play-btn" id="playBtn" onclick="togglePlay()" aria-label="Play/Pause">
                <svg id="playIcon" width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="ctrl-btn" onclick="siguiente()" aria-label="Siguiente">
                <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zm2.5-6 8.5 6V6z"/></svg>
            </button>
            <span class="time-disp" id="timeDsp">0:00 / 0:00</span>
        </div>

        <div class="player-extras">
            <div class="vol-wrap">
                <svg width="16" height="16" fill="var(--text-muted)" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                <input type="range" id="volSlider" min="0" max="1" step="0.02" value="1" oninput="cambiarVolumen(this.value)">
            </div>
            <button class="ctrl-btn" onclick="toggleQueue()" aria-label="Cola">
                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h12v2H3v-2z"/></svg>
            </button>
        </div>
    </div>
</div>

<div class="queue-overlay" id="queueOverlay" onclick="toggleQueue()"></div>
<div class="queue-panel" id="queuePanel">
    <div class="queue-header">
        <h3>Cola</h3>
        <span class="queue-count" id="queueCount">0 canciones</span>
        <button class="ctrl-btn" onclick="toggleQueue()" aria-label="Cerrar">
            <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
    </div>
    <div class="queue-list" id="queueList">
        <p style="text-align:center;color:var(--text-muted);padding:30px 20px">La cola está vacía</p>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== CONFIGURACIÓN YOUTUBE ====================
let ytPlayer;
let isYtReady = false;
let progressInterval;

function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player('ytPlayer', {
        height: '300', width: '300', videoId: '', // Tamaño real para engañar a Safari
        playerVars: { 'playsinline': 1, 'controls': 0, 'disablekb': 1, 'fs': 0, 'rel': 0, 'autoplay': 1 },
        events: {
            'onReady': () => { isYtReady = true; },
            'onStateChange': onPlayerStateChange,
            'onError': onPlayerError
        }
    });
}

function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.PLAYING) {
        setPlayIcon(true);
        clearInterval(progressInterval);
        progressInterval = setInterval(updateProgress, 500);
    } else if (event.data === YT.PlayerState.PAUSED) {
        setPlayIcon(false);
        clearInterval(progressInterval);
    } else if (event.data === YT.PlayerState.ENDED) {
        siguiente();
    }
}

// Si YouTube bloquea un video (Error 150), saltamos automáticamente
function onPlayerError(event) {
    console.error("YouTube bloqueó este video:", event.data);
    toast('⚠️ VEVO bloqueó esta canción, saltando...');
    setTimeout(siguiente, 1500);
}

function updateProgress() {
    if (!isYtReady || !ytPlayer.getDuration) return;
    const dur = ytPlayer.getDuration() || 0;
    const cur = ytPlayer.getCurrentTime() || 0;
    if (dur > 0) {
        const pct = (cur / dur) * 100;
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('timeDsp').textContent = `${fmt(cur)} / ${fmt(dur)}`;
    }
}

function cambiarVolumen(val) {
    if (isYtReady && ytPlayer.setVolume) ytPlayer.setVolume(val * 100);
}

// ==================== ESTADO ====================
let cola = [];
let indiceActual = -1;

const grid = document.getElementById('grid');
const trackThumb = document.getElementById('trackThumb');
const trackPlaceholder = document.getElementById('trackPlaceholder');
const trackName = document.getElementById('trackName');
const trackArtist = document.getElementById('trackArtist');
const playIcon = document.getElementById('playIcon');
const queueCount = document.getElementById('queueCount');

if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(() => {}); }

async function buscar() {
    const q = document.getElementById('searchInput').value.trim();
    if (!q) return;
    document.getElementById('sectionTitle').textContent = `Resultados: "${q}"`;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    await cargarResultados(q);
}

async function buscarGenero(chip, query) {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    document.getElementById('searchInput').value = '';
    document.getElementById('sectionTitle').textContent = chip.textContent;
    await cargarResultados(query);
}

async function cargarResultados(query) {
    grid.innerHTML = `<div class="empty-state"><div class="spinner"></div><p>Buscando...</p></div>`;
    try {
        const resApple = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=24&lang=es_es`);
        const dataApple = await resApple.json();

        if (dataApple.results && dataApple.results.length > 0) {
            cola = dataApple.results.map(s => ({
                titulo: s.trackName,
                artista: s.artistName,
                portada: s.artworkUrl100.replace('100x100bb', '512x512bb'),
                // EL TRUCO: Buscamos "letra" en lugar de "audio oficial" para esquivar a VEVO y sus bloqueos de reproducción
                busqueda: `${s.artistName} ${s.trackName} letra`
            }));
        } else {
            grid.innerHTML = `<div class="empty-state"><h3>Sin resultados</h3><p>Intenta otro término de búsqueda</p></div>`;
            return;
        }

        queueCount.textContent = `${cola.length} canciones`;
        renderGrid();
        renderQueueList();

    } catch (e) {
        grid.innerHTML = `<div class="empty-state"><h3>Error de red</h3><p>Verifica tu conexión e intenta de nuevo</p></div>`;
    }
}

function renderGrid() {
    grid.innerHTML = cola.map((s, i) => `
        <div class="card${i === indiceActual ? ' playing' : ''}" id="card-${i}" onclick="reproducirIndice(${i})">
            <div class="card-img-wrap">
                <img src="${s.portada}" alt="${escHtml(s.titulo)}" loading="lazy">
                <div class="card-play-btn"><svg width="16" height="16" fill="white" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
            </div>
            <div class="card-title">${escHtml(s.titulo)}</div>
            <div class="card-artist">${escHtml(s.artista)}</div>
        </div>
    `).join('');
}

function escHtml(str) { return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// ==================== REPRODUCCIÓN ====================
async function reproducirIndice(i) {
    if (i < 0 || i >= cola.length) return;
    indiceActual = i;
    const cancion = cola[i];

    trackThumb.src = cancion.portada;
    trackThumb.classList.remove('hidden');
    trackPlaceholder.style.display = 'none';
    trackName.textContent = 'Cargando pista...';
    trackArtist.textContent = cancion.artista;

    document.querySelectorAll('.card').forEach((c, idx) => c.classList.toggle('playing', idx === i));
    renderQueueList();
    setPlayIcon(false);

    try {
        let vId = cancion.videoId;

        if (!vId) {
            const resRender = await fetch(`/api/search-yt?q=${encodeURIComponent(cancion.busqueda)}`);
            if (resRender.ok) {
                const data = await resRender.json();
                vId = data.videoId;
                cancion.videoId = vId; 
            }
        }

        if (!vId) throw new Error('No se encontró el video.');

        if (isYtReady) {
            ytPlayer.loadVideoById(vId);
            trackName.textContent = cancion.titulo;
        } else {
            toast('El reproductor se está inicializando, intenta en un segundo...');
        }

        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: cancion.titulo, artist: cancion.artista, album: 'FamiMusic',
                artwork: [{ src: cancion.portada, sizes: '512x512', type: 'image/jpeg' }]
            });
            navigator.mediaSession.setActionHandler('previoustrack', anterior);
            navigator.mediaSession.setActionHandler('nexttrack', siguiente);
            navigator.mediaSession.setActionHandler('play', togglePlay);
            navigator.mediaSession.setActionHandler('pause', togglePlay);
        }

    } catch (err) {
        trackName.textContent = 'Error';
        toast('⚠️ Error al buscar la canción.');
        setTimeout(siguiente, 2000);
    }
}

function togglePlay() {
    if (!isYtReady) return;
    const state = ytPlayer.getPlayerState();
    if (state === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
    else ytPlayer.playVideo();
}

function anterior() {
    if (indiceActual > 0) reproducirIndice(indiceActual - 1);
    else toast('Ya estás en la primera canción');
}

function siguiente() {
    if (indiceActual < cola.length - 1) reproducirIndice(indiceActual + 1);
    else toast('🎵 Fin de la cola');
}

function setPlayIcon(playing) {
    playIcon.innerHTML = playing ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
}

document.getElementById('progressWrap').addEventListener('click', e => {
    if (!isYtReady || !ytPlayer.getDuration) return;
    const dur = ytPlayer.getDuration();
    if (!dur) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const seekToTime = ((e.clientX - rect.left) / rect.width) * dur;
    ytPlayer.seekTo(seekToTime, true);
});

function fmt(s) { s = Math.floor(s || 0); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }

function toggleQueue() {
    document.getElementById('queuePanel').classList.toggle('open');
    document.getElementById('queueOverlay').classList.toggle('open');
    renderQueueList();
}

function renderQueueList() {
    const list = document.getElementById('queueList');
    if (!cola.length) { list.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:30px 20px">La cola está vacía</p>'; return; }
    list.innerHTML = cola.map((s, i) => `
        <div class="queue-item${i === indiceActual ? ' current' : ''}" onclick="reproducirIndice(${i}); if(window.innerWidth < 680) toggleQueue()">
            <span class="queue-num">${i === indiceActual ? '▶' : i+1}</span>
            <img src="${s.portada}" alt="" loading="lazy">
            <div class="qi-texts"><div class="qi-title">${escHtml(s.titulo)}</div><div class="qi-artist">${escHtml(s.artista)}</div></div>
        </div>
    `).join('');
    const cur = list.querySelector('.current');
    if (cur) cur.scrollIntoView({ block: 'nearest' });
}

let toastTimer;
function toast(msg) {
    const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

function cargarTrending(chipElement = null) {
    if (chipElement) {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chipElement.classList.add('active');
        document.getElementById('searchInput').value = '';
        document.getElementById('sectionTitle').textContent = chipElement.textContent;
    }
    const terminos = ['hits 2026', 'top 50 global', 'éxitos virales', 'lo mas escuchado', 'top latino 2026', 'tendencias globales', 'pop hits 2026'];
    cargarResultados(terminos[Math.floor(Math.random() * terminos.length)]);
}

cargarTrending();
</script>
