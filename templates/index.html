<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FamiMusic — Apple Music Style</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="logo">🎵 FamiMusic</div>
            <nav class="nav-links">
                <a href="#" data-section="home" class="active">Para Ti</a>
                <a href="#" data-section="explore">Explorar</a>
                <a href="#" data-section="radio">Radio</a>
            </nav>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar canciones...">
            </div>
            <div class="playlists">
                <p class="section-title">Tus listas</p>
                <ul>
                    <li data-playlist="favorites">❤️ Favoritos</li>
                    <li data-playlist="mix">🎧 Mezcla diaria</li>
                    <li data-playlist="driving">🚗 Conducción</li>
                </ul>
            </div>
        </aside>
        <main class="main-content" id="mainContent"></main>
        <div class="player-bar" id="playerBar" style="display: none;">
            <div class="player-info">
                <img id="currentThumb" width="48" height="48">
                <div id="currentTitle" class="track-title"></div>
            </div>
            <div class="player-controls">
                <button id="playPauseBtn">⏸️</button>
                <button id="favBtn">❤️</button>
            </div>
            <div id="youtube-player"></div>
        </div>
    </div>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // ========== CANCIONES DE RESPALDO (SIEMPRE FUNCIONAN) ==========
        const BACKUP_SONGS = [
            { id: "dQw4w9WgXcQ", title: "Never Gonna Give You Up", thumb: "https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg" },
            { id: "kJQP7kiw5Fk", title: "Dance Monkey", thumb: "https://img.youtube.com/vi/kJQP7kiw5Fk/hqdefault.jpg" },
            { id: "RgKAFK5djSk", title: "Levitating", thumb: "https://img.youtube.com/vi/RgKAFK5djSk/hqdefault.jpg" },
            { id: "3JZ4pnNtyxQ", title: "Blinding Lights", thumb: "https://img.youtube.com/vi/3JZ4pnNtyxQ/hqdefault.jpg" },
            { id: "fJ9rUzIMcZQ", title: "Bohemian Rhapsody", thumb: "https://img.youtube.com/vi/fJ9rUzIMcZQ/hqdefault.jpg" },
            { id: "YQHsXMglC9A", title: "Shape of You", thumb: "https://img.youtube.com/vi/YQHsXMglC9A/hqdefault.jpg" },
            { id: "CevxZvSJLk8", title: "Uptown Funk", thumb: "https://img.youtube.com/vi/CevxZvSJLk8/hqdefault.jpg" },
            { id: "JGwWNGJdvx8", title: "Sorry", thumb: "https://img.youtube.com/vi/JGwWNGJdvx8/hqdefault.jpg" }
        ];

        let player, currentVideoId, isPlaying = false, currentSongData = null;
        let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0', width: '0', playerVars: { autoplay: 0, controls: 0, mute: 1, enablejsapi: 1 },
                events: { onReady: () => console.log("Player listo"), onStateChange: (e) => {
                    if (e.data === YT.PlayerState.PLAYING) { isPlaying = true; playPauseBtn.textContent = '⏸️'; if (player.isMuted()) showUnmute(); }
                    else if (e.data === YT.PlayerState.PAUSED) { isPlaying = false; playPauseBtn.textContent = '▶️'; }
                }}
            });
        }

        function showUnmute() {
            let btn = document.getElementById('unmuteBtn');
            if (!btn) {
                btn = document.createElement('div');
                btn.id = 'unmuteBtn';
                btn.innerHTML = '🔊 Activar sonido';
                btn.style.cssText = 'position:fixed; bottom:80px; right:20px; background:#ff3b30; color:white; padding:10px 18px; border-radius:40px; cursor:pointer; z-index:2000;';
                btn.onclick = () => { player.unMute(); btn.remove(); };
                document.body.appendChild(btn);
            }
        }

        function playSong(videoId, title, thumb) {
            if (!player) return;
            currentVideoId = videoId;
            currentSongData = { id: videoId, title, thumb };
            document.getElementById('playerBar').style.display = 'flex';
            document.getElementById('currentTitle').innerHTML = title;
            document.getElementById('currentThumb').src = thumb;
            updateFavButton();
            player.loadVideoById({ videoId, startSeconds: 0 });
        }

        document.getElementById('playPauseBtn').onclick = () => { if (currentVideoId) { if (isPlaying) player.pauseVideo(); else player.playVideo(); } };
        document.getElementById('favBtn').onclick = () => {
            if (!currentSongData) return;
            const idx = favorites.findIndex(f => f.id === currentSongData.id);
            idx === -1 ? favorites.push(currentSongData) : favorites.splice(idx, 1);
            localStorage.setItem('favorites', JSON.stringify(favorites));
            updateFavButton();
            if (document.querySelector('.active')?.innerText === 'Favoritos') loadFavorites();
        };
        function updateFavButton() { document.getElementById('favBtn').innerHTML = favorites.some(f => f.id === currentSongData?.id) ? '❤️' : '🤍'; }

        // ========== CONEXIÓN CON BACKEND + FALLBACK ==========
        async function fetchSongs(query) {
    try {
        const res = await fetch(`/search/${encodeURIComponent(query)}`);
        if (!res.ok) {
            const errorData = await res.json();
            console.error("Error del backend:", errorData);
            throw new Error(errorData.error || "Error en la búsqueda");
        }
        const data = await res.json();
        // Si el backend devuelve un array vacío, no hay resultados
        if (data && Array.isArray(data) && data.length === 0) {
            console.warn(`No se encontraron canciones para "${query}"`);
            return []; // devolvemos vacío para que el frontend muestre "No hay resultados"
        }
        if (data && Array.isArray(data) && data.length > 0) return data;
        else return [];
    } catch (err) {
        console.error("Fallo en fetchSongs:", err);
        return []; // no usamos fallback automático, dejamos que la UI muestre el error
    }
}
        function renderCards(songs, containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';
            if (!songs.length) { container.innerHTML = '<div class="loading-cards">No hay canciones disponibles</div>'; return; }
            songs.forEach(song => {
                const card = document.createElement('div');
                card.className = 'music-card';
                card.innerHTML = `
                    <div class="card-img"><img src="${song.thumb}"><button class="play-btn" data-id="${song.id}" data-title="${escapeHtml(song.title)}" data-thumb="${song.thumb}">▶</button></div>
                    <div class="card-title">${escapeHtml(song.title)}</div>
                `;
                container.appendChild(card);
            });
            document.querySelectorAll('.play-btn').forEach(btn => {
                btn.onclick = (e) => { e.stopPropagation(); playSong(btn.dataset.id, btn.dataset.title, btn.dataset.thumb); };
            });
        }

        // ========== VISTAS ==========
        async function loadHome() {
            document.getElementById('mainContent').innerHTML = `<div class="section-header"><h2>Recomendado para ti</h2></div><div class="cards-grid" id="homeGrid"></div>`;
            const songs = await fetchSongs('pop music');
            renderCards(songs.length ? songs : BACKUP_SONGS, 'homeGrid');
        }
        async function loadExplore() {
            document.getElementById('mainContent').innerHTML = `<div class="section-header"><h2>Explorar</h2></div><div class="cards-grid" id="exploreGrid"></div>`;
            const songs = await fetchSongs('latin hits');
            renderCards(songs, 'exploreGrid');
        }
        async function loadRadio() {
            document.getElementById('mainContent').innerHTML = `<div class="section-header"><h2>Radio</h2></div><div class="cards-grid" id="radioGrid"></div>`;
            const random = BACKUP_SONGS.sort(() => 0.5 - Math.random());
            renderCards(random, 'radioGrid');
        }
        async function loadMixDiaria() {
            document.getElementById('mainContent').innerHTML = `<div class="section-header"><h2>Mezcla diaria</h2></div><div class="cards-grid" id="mixGrid"></div>`;
            const songs = await fetchSongs('morning mix');
            renderCards(songs, 'mixGrid');
        }
        async function loadDriving() {
            document.getElementById('mainContent').innerHTML = `<div class="section-header"><h2>Conducción</h2></div><div class="cards-grid" id="drivingGrid"></div>`;
            const songs = await fetchSongs('driving rock');
            renderCards(songs, 'drivingGrid');
        }
        function loadFavorites() {
            document.getElementById('mainContent').innerHTML = `<div class="section-header"><h2>Favoritos</h2></div><div class="cards-grid" id="favGrid"></div>`;
            renderCards(favorites, 'favGrid');
        }
        async function performSearch(query) {
            document.getElementById('mainContent').innerHTML = `<div class="section-header"><h2>Resultados: ${escapeHtml(query)}</h2></div><div class="cards-grid" id="searchGrid"></div>`;
            const songs = await fetchSongs(query);
            renderCards(songs, 'searchGrid');
        }

        function setupEvents() {
            document.querySelectorAll('.nav-links a').forEach(a => {
                a.onclick = (e) => {
                    e.preventDefault();
                    document.querySelectorAll('.nav-links a').forEach(l => l.classList.remove('active'));
                    a.classList.add('active');
                    if (a.dataset.section === 'home') loadHome();
                    else if (a.dataset.section === 'explore') loadExplore();
                    else if (a.dataset.section === 'radio') loadRadio();
                };
            });
            document.querySelectorAll('.playlists li').forEach(li => {
                li.onclick = () => {
                    if (li.dataset.playlist === 'favorites') loadFavorites();
                    else if (li.dataset.playlist === 'mix') loadMixDiaria();
                    else if (li.dataset.playlist === 'driving') loadDriving();
                };
            });
            document.getElementById('searchInput').onkeypress = (e) => {
                if (e.key === 'Enter') performSearch(e.target.value.trim());
            };
        }

        function escapeHtml(str) { return str.replace(/[&<>]/g, function(m) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]; }); }

        window.onload = () => { setupEvents(); loadHome(); };
    </script>
    <style>
        /* mismo CSS que diste antes, pero lo resumo para que no se alargue; copia el style.css que ya tenías */
    </style>
</body>
</html>
