<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FamiMusic — Apple Music Style</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <!-- Sidebar estilo Apple Music -->
        <aside class="sidebar">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0 13c-2.33 0-4.31-1.46-5.11-3.5h10.22c-.8 2.04-2.78 3.5-5.11 3.5z" fill="url(#grad)"/>
                    <defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ff6a88"/><stop offset="100%" stop-color="#ff99ac"/></linearGradient></defs>
                </svg>
                <span>FamiMusic</span>
            </div>
            <nav class="nav-links">
                <a href="#" data-section="home" class="active">Para Ti</a>
                <a href="#" data-section="explore">Explorar</a>
                <a href="#" data-section="radio">Radio</a>
            </nav>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar canciones, artistas...">
            </div>
            <div class="playlists">
                <p class="section-title">Tus listas</p>
                <ul>
                    <li data-playlist="favorites">❤️ Favoritos</li>
                    <li data-playlist="mix">🎧 Mezcla diaria</li>
                    <li data-playlist="driving">🚗 Conducción</li>
                </ul>
            </div>
        </aside>

        <!-- Contenido principal -->
        <main class="main-content" id="mainContent">
            <!-- Aquí se inyectará el contenido dinámico (home, explorar, etc.) -->
            <div id="dynamicContent"></div>
        </main>

        <!-- Reproductor flotante estilo Apple Music -->
        <div class="player-bar" id="playerBar" style="display: none;">
            <div class="player-info">
                <img id="currentThumb" src="" alt="cover" width="48" height="48">
                <div class="track-details">
                    <div id="currentTitle" class="track-title">Canción</div>
                    <div class="track-artist">FamiMusic</div>
                </div>
            </div>
            <div class="player-controls">
                <button id="playPauseBtn" class="control-btn">⏸️</button>
                <button id="favBtn" class="control-btn" style="font-size:1.2rem;">❤️</button>
            </div>
            <div id="youtube-player" style="position: absolute; bottom: 0; left: 0; opacity: 0; pointer-events: none; width: 0; height: 0;"></div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // ---------- GLOBALES ----------
        let player;
        let currentVideoId = null;
        let isPlaying = false;
        let currentSongData = null;
        let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');

        // ---------- INICIALIZAR PLAYER YOUTUBE ----------
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                playerVars: {
                    autoplay: 0,
                    controls: 0,
                    modestbranding: 1,
                    rel: 0,
                    enablejsapi: 1,
                    mute: 1
                },
                events: {
                    onReady: () => console.log("Player listo"),
                    onStateChange: onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                document.getElementById('playPauseBtn').textContent = '⏸️';
                if (player.isMuted()) showUnmuteButton();
            } else if (event.data === YT.PlayerState.PAUSED) {
                isPlaying = false;
                document.getElementById('playPauseBtn').textContent = '▶️';
            }
        }

        function showUnmuteButton() {
            let btn = document.getElementById('globalUnmute');
            if (!btn) {
                btn = document.createElement('div');
                btn.id = 'globalUnmute';
                btn.innerHTML = '🔊 Activar sonido';
                btn.style.cssText = 'position:fixed; bottom:80px; right:20px; background:#ff3b30; color:white; padding:10px 18px; border-radius:40px; font-weight:bold; cursor:pointer; z-index:2000; box-shadow:0 2px 12px rgba(0,0,0,0.3);';
                btn.onclick = () => { player.unMute(); btn.remove(); };
                document.body.appendChild(btn);
            }
        }

        // ---------- FUNCIÓN PRINCIPAL: REPRODUCIR ----------
        function playSong(videoId, title, thumb) {
            if (!player) return;
            currentVideoId = videoId;
            currentSongData = { id: videoId, title, thumb };
            document.getElementById('playerBar').style.display = 'flex';
            document.getElementById('currentTitle').textContent = title;
            document.getElementById('currentThumb').src = thumb;
            updateFavButtonState();
            player.loadVideoById({ videoId, startSeconds: 0 });
        }

        document.getElementById('playPauseBtn').addEventListener('click', () => {
            if (!currentVideoId) return;
            if (isPlaying) player.pauseVideo();
            else player.playVideo();
        });

        // ---------- FAVORITOS ----------
        function updateFavButtonState() {
            const btn = document.getElementById('favBtn');
            if (!currentSongData) return;
            const isFav = favorites.some(f => f.id === currentSongData.id);
            btn.textContent = isFav ? '❤️' : '🤍';
        }

        document.getElementById('favBtn').addEventListener('click', () => {
            if (!currentSongData) return;
            const index = favorites.findIndex(f => f.id === currentSongData.id);
            if (index === -1) {
                favorites.push({ id: currentSongData.id, title: currentSongData.title, thumb: currentSongData.thumb });
            } else {
                favorites.splice(index, 1);
            }
            localStorage.setItem('favorites', JSON.stringify(favorites));
            updateFavButtonState();
            // Si estamos en la vista de favoritos, refrescarla
            if (document.querySelector('.nav-links a.active')?.dataset.section === 'favorites-view') {
                loadFavoritesView();
            }
        });

        // ---------- RENDERIZADO DE TARJETAS (GRID) ----------
        function renderCards(songs, containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';
            if (!songs.length) {
                container.innerHTML = '<div class="loading-cards">🎵 No hay canciones para mostrar</div>';
                return;
            }
            songs.forEach(song => {
                const card = document.createElement('div');
                card.className = 'music-card';
                card.innerHTML = `
                    <div class="card-img">
                        <img src="${song.thumb}" alt="${escapeHtml(song.title)}">
                        <button class="play-btn-overlay" data-id="${song.id}" data-title="${escapeHtml(song.title)}" data-thumb="${song.thumb}">▶</button>
                    </div>
                    <div class="card-info">
                        <div class="card-title">${escapeHtml(song.title)}</div>
                        <div class="card-sub">${song.artist || 'Artista'}</div>
                    </div>
                `;
                container.appendChild(card);
            });
            document.querySelectorAll('.play-btn-overlay').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    playSong(btn.dataset.id, btn.dataset.title, btn.dataset.thumb);
                });
            });
        }

        // ---------- CARGAR CONTENIDO DESDE API (búsqueda genérica) ----------
        async function fetchSongs(query, maxResults = 20) {
            try {
                const res = await fetch(`/search/${encodeURIComponent(query)}?max=${maxResults}`);
                const songs = await res.json();
                return songs;
            } catch (err) {
                console.error(err);
                return [];
            }
        }

        // ---------- VISTAS DINÁMICAS ----------
        async function loadHome() {
            const html = `
                <div class="hero"><h1>Buenas noches</h1><p>Escucha lo que te gusta, sin interrupciones.</p></div>
                <div class="section-header"><h2>Recomendado para ti</h2></div>
                <div class="cards-grid" id="homeGrid"></div>
            `;
            document.getElementById('dynamicContent').innerHTML = html;
            // Cargar múltiples géneros para tener más de 3 canciones
            const queries = ['pop hits', 'rock classics', 'latin music', 'electronic dance'];
            let allSongs = [];
            for (let q of queries) {
                const songs = await fetchSongs(q, 6);
                allSongs = allSongs.concat(songs);
            }
            // Eliminar duplicados por id
            const unique = allSongs.filter((v, i, a) => a.findIndex(t => t.id === v.id) === i);
            renderCards(unique.slice(0, 18), 'homeGrid'); // máximo 18 canciones
        }

        async function loadExplore() {
            const html = `<div class="section-header"><h2>Explorar géneros</h2></div>
                          <div class="cards-grid" id="exploreGrid"></div>`;
            document.getElementById('dynamicContent').innerHTML = html;
            const genres = ['reggaeton', 'indie', 'jazz', 'classical', 'metal', 'hip hop'];
            let allSongs = [];
            for (let g of genres) {
                const songs = await fetchSongs(g, 4);
                allSongs = allSongs.concat(songs);
            }
            const unique = allSongs.filter((v,i,a)=>a.findIndex(t=>t.id===v.id)===i);
            renderCards(unique.slice(0, 24), 'exploreGrid');
        }

        async function loadRadio() {
            const html = `<div class="section-header"><h2>Radio FamiMusic</h2><p>Mezcla aleatoria continua</p></div>
                          <div class="cards-grid" id="radioGrid"></div>`;
            document.getElementById('dynamicContent').innerHTML = html;
            const randomQueries = ['random mix', 'top 40', 'viral hits', 'alternative'];
            let songs = await fetchSongs(randomQueries[Math.floor(Math.random()*randomQueries.length)], 12);
            renderCards(songs, 'radioGrid');
        }

        async function loadMixDiaria() {
            const html = `<div class="section-header"><h2>🎧 Mezcla diaria</h2><p>Actualizada cada día para ti</p></div>
                          <div class="cards-grid" id="mixGrid"></div>`;
            document.getElementById('dynamicContent').innerHTML = html;
            // Simular mezcla diaria: canciones populares del día de hoy
            const day = new Date().getDay();
            const moods = ['happy', 'chill', 'energy', 'focus'];
            const songs = await fetchSongs(moods[day % moods.length], 15);
            renderCards(songs, 'mixGrid');
        }

        async function loadDriving() {
            const html = `<div class="section-header"><h2>🚗 Conducción</h2><p>Ritmo para la carretera</p></div>
                          <div class="cards-grid" id="drivingGrid"></div>`;
            document.getElementById('dynamicContent').innerHTML = html;
            const songs = await fetchSongs('driving rock', 12);
            renderCards(songs, 'drivingGrid');
        }

        function loadFavoritesView() {
            const html = `<div class="section-header"><h2>❤️ Tus favoritos</h2></div>
                          <div class="cards-grid" id="favGrid"></div>`;
            document.getElementById('dynamicContent').innerHTML = html;
            renderCards(favorites, 'favGrid');
        }

        // ---------- BÚSQUEDA ----------
        async function performSearch(query) {
            const html = `<div class="section-header"><h2>Resultados para: "${escapeHtml(query)}"</h2></div>
                          <div class="cards-grid" id="searchResultGrid"></div>`;
            document.getElementById('dynamicContent').innerHTML = html;
            const songs = await fetchSongs(query, 24);
            renderCards(songs, 'searchResultGrid');
        }

        // ---------- EVENTOS DEL SIDEBAR ----------
        function setupSidebarEvents() {
            // Navegación principal
            document.querySelectorAll('.nav-links a').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    document.querySelectorAll('.nav-links a').forEach(l => l.classList.remove('active'));
                    link.classList.add('active');
                    const section = link.dataset.section;
                    if (section === 'home') loadHome();
                    else if (section === 'explore') loadExplore();
                    else if (section === 'radio') loadRadio();
                });
            });
            // Playlists del sidebar
            document.querySelectorAll('.playlists li').forEach(li => {
                li.addEventListener('click', () => {
                    const playlist = li.dataset.playlist;
                    if (playlist === 'favorites') loadFavoritesView();
                    else if (playlist === 'mix') loadMixDiaria();
                    else if (playlist === 'driving') loadDriving();
                    // Marcar visualmente como activo (opcional)
                    document.querySelectorAll('.nav-links a').forEach(l => l.classList.remove('active'));
                });
            });
            // Búsqueda
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('keypress', async (e) => {
                if (e.key === 'Enter') {
                    const query = searchInput.value.trim();
                    if (query) {
                        await performSearch(query);
                        searchInput.blur();
                    }
                }
            });
        }

        // Helper
        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Inicializar
        window.onload = () => {
            setupSidebarEvents();
            loadHome(); // carga principal con muchas canciones
        };
    </script>
</body>
</html>
        <!-- Contenido principal (estilo Apple Music con cards) -->
        <main class="main-content">
            <div class="hero">
                <h1>Buenas noches</h1>
                <p>Escucha lo que te gusta, sin interrupciones.</p>
            </div>

            <!-- Sección de recomendaciones (cards grandes) -->
            <div class="recommendations-section">
                <div class="section-header">
                    <h2>Recomendado para ti</h2>
                    <a href="#" class="see-all">Ver todo</a>
                </div>
                <div class="cards-grid" id="recommendationsGrid">
                    <!-- Aquí se cargarán dinámicamente las canciones recomendadas -->
                    <div class="loading-cards">Cargando tu música...</div>
                </div>
            </div>

            <!-- Resultados de búsqueda (se muestran al buscar) -->
            <div id="searchResults" style="display: none;">
                <div class="section-header">
                    <h2>Resultados</h2>
                    <a href="#" id="closeResults" class="see-all">Cerrar</a>
                </div>
                <div class="cards-grid" id="resultsGrid"></div>
            </div>
        </main>

        <!-- Reproductor flotante estilo Apple Music -->
        <div class="player-bar" id="playerBar" style="display: none;">
            <div class="player-info">
                <img id="currentThumb" src="" alt="cover" width="48" height="48">
                <div class="track-details">
                    <div id="currentTitle" class="track-title">Canción</div>
                    <div class="track-artist">FamiMusic</div>
                </div>
            </div>
            <div class="player-controls">
                <button id="playPauseBtn" class="control-btn">⏸️</button>
            </div>
            <div id="youtube-player" style="position: absolute; bottom: 0; left: 0; opacity: 0; pointer-events: none;"></div>
        </div>
    </div>

    <!-- API de YouTube -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // ---------- ESTADO GLOBAL ----------
        let player;
        let currentVideoId = null;
        let isPlaying = false;
        let currentSongData = null;

        // ---------- INICIALIZAR YOUTUBE PLAYER ----------
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                playerVars: {
                    autoplay: 0,
                    controls: 0,
                    modestbranding: 1,
                    rel: 0,
                    enablejsapi: 1,
                    mute: 1   // Necesario para evitar bloqueo de autoplay
                },
                events: {
                    onReady: () => console.log("Player listo"),
                    onStateChange: onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                document.getElementById('playPauseBtn').textContent = '⏸️';
                if (player.isMuted()) showUnmuteButton();
            } else if (event.data === YT.PlayerState.PAUSED) {
                isPlaying = false;
                document.getElementById('playPauseBtn').textContent = '▶️';
            }
        }

        function showUnmuteButton() {
            let btn = document.getElementById('globalUnmute');
            if (!btn) {
                btn = document.createElement('div');
                btn.id = 'globalUnmute';
                btn.innerHTML = '🔊 Activar sonido';
                btn.style.position = 'fixed';
                btn.style.bottom = '80px';
                btn.style.right = '20px';
                btn.style.background = '#ff3b30';
                btn.style.color = 'white';
                btn.style.padding = '10px 18px';
                btn.style.borderRadius = '40px';
                btn.style.fontWeight = 'bold';
                btn.style.cursor = 'pointer';
                btn.style.zIndex = '2000';
                btn.style.boxShadow = '0 2px 12px rgba(0,0,0,0.3)';
                btn.onclick = () => {
                    player.unMute();
                    btn.remove();
                };
                document.body.appendChild(btn);
            }
        }

        // ---------- CARGAR RECOMENDACIONES (MÚSICA POPULAR) ----------
        async function loadRecommendations() {
            const grid = document.getElementById('recommendationsGrid');
            grid.innerHTML = '<div class="loading-cards">🎵 Cargando recomendaciones...</div>';
            try {
                // Buscamos música popular en varias categorías para simular "Para ti"
                const queries = ['pop hits 2025', 'relaxing acoustic', 'latin vibes', 'indie playlist'];
                const randomQuery = queries[Math.floor(Math.random() * queries.length)];
                const res = await fetch(`/search/${encodeURIComponent(randomQuery)}`);
                let songs = await res.json();
                if (!songs.length) songs = getFallbackSongs();
                renderCards(songs, 'recommendationsGrid');
            } catch (err) {
                console.error(err);
                renderCards(getFallbackSongs(), 'recommendationsGrid');
            }
        }

        function getFallbackSongs() {
            return [
                { id: "dQw4w9WgXcQ", title: "Blinding Lights", thumb: "https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg" },
                { id: "kJQP7kiw5Fk", title: "Dance Monkey", thumb: "https://img.youtube.com/vi/kJQP7kiw5Fk/hqdefault.jpg" },
                { id: "RgKAFK5djSk", title: "Levitating", thumb: "https://img.youtube.com/vi/RgKAFK5djSk/hqdefault.jpg" }
            ];
        }

        function renderCards(songs, containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';
            songs.forEach(song => {
                const card = document.createElement('div');
                card.className = 'music-card';
                card.innerHTML = `
                    <div class="card-img">
                        <img src="${song.thumb}" alt="${escapeHtml(song.title)}">
                        <button class="play-btn-overlay" data-id="${song.id}" data-title="${escapeHtml(song.title)}" data-thumb="${song.thumb}">▶</button>
                    </div>
                    <div class="card-info">
                        <div class="card-title">${escapeHtml(song.title)}</div>
                        <div class="card-sub">Artista destacado</div>
                    </div>
                `;
                container.appendChild(card);
            });
            // Asignar eventos a los botones de play
            document.querySelectorAll('.play-btn-overlay').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    const title = btn.dataset.title;
                    const thumb = btn.dataset.thumb;
                    playSong(id, title, thumb);
                });
            });
        }

        // ---------- REPRODUCIR CANCIÓN (con interacción garantizada) ----------
        async function playSong(videoId, title, thumb) {
            currentVideoId = videoId;
            currentSongData = { title, thumb };
            // Mostrar barra de reproducción
            const playerBar = document.getElementById('playerBar');
            playerBar.style.display = 'flex';
            document.getElementById('currentTitle').textContent = title;
            document.getElementById('currentThumb').src = thumb;
            
            if (player && player.loadVideoById) {
                // El usuario hizo clic → interacción válida para desbloquear audio
                player.loadVideoById({ videoId: videoId, startSeconds: 0 });
                // El player está muteado inicialmente, pero el usuario puede hacer clic en "Activar sonido"
                // Para mejorar UX, podríamos desmutear automáticamente tras el clic (pero depende del navegador)
                // Lo dejamos con el botón de activar sonido.
            } else {
                console.warn("Player no listo, reintentando...");
                setTimeout(() => playSong(videoId, title, thumb), 500);
            }
        }

        // Control de play/pause desde la barra
        document.getElementById('playPauseBtn').addEventListener('click', () => {
            if (!player || !currentVideoId) return;
            if (isPlaying) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        });

        // ---------- BÚSQUEDA ----------
        const searchInput = document.getElementById('searchInput');
        const searchResultsDiv = document.getElementById('searchResults');
        const resultsGrid = document.getElementById('resultsGrid');
        const closeResults = document.getElementById('closeResults');

        searchInput.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const query = searchInput.value.trim();
                if (!query) return;
                try {
                    const res = await fetch(`/search/${encodeURIComponent(query)}`);
                    const songs = await res.json();
                    renderCards(songs, 'resultsGrid');
                    searchResultsDiv.style.display = 'block';
                    document.getElementById('recommendations-section').style.display = 'none'; // ocultar recomendaciones mientras busca
                } catch (err) {
                    console.error(err);
                }
            }
        });

        closeResults.addEventListener('click', (e) => {
            e.preventDefault();
            searchResultsDiv.style.display = 'none';
            document.getElementById('recommendations-section').style.display = 'block';
            searchInput.value = '';
        });

        // Helper
        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Inicializar la página
        window.onload = () => {
            loadRecommendations();
        };
    </script>
</body>
</html>
