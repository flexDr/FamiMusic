<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FamiMusic — Apple Music Style</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <!-- Sidebar estilo Apple Music -->
        <aside class="sidebar">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0 13c-2.33 0-4.31-1.46-5.11-3.5h10.22c-.8 2.04-2.78 3.5-5.11 3.5z" fill="url(#grad)"/>
                    <defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ff6a88"/><stop offset="100%" stop-color="#ff99ac"/></linearGradient></defs>
                </svg>
                <span>FamiMusic</span>
            </div>
            <nav class="nav-links">
                <a href="#" class="active">Para Ti</a>
                <a href="#">Explorar</a>
                <a href="#">Radio</a>
            </nav>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar canciones, artistas...">
            </div>
            <div class="playlists">
                <p class="section-title">Tus listas</p>
                <ul>
                    <li>❤️ Favoritos</li>
                    <li>🎧 Mezcla diaria</li>
                    <li>🚗 Conducción</li>
                </ul>
            </div>
        </aside>

        <!-- Contenido principal (estilo Apple Music con cards) -->
        <main class="main-content">
            <div class="hero">
                <h1>Buenas noches</h1>
                <p>Escucha lo que te gusta, sin interrupciones.</p>
            </div>

            <!-- Sección de recomendaciones (cards grandes) -->
            <div class="recommendations-section">
                <div class="section-header">
                    <h2>Recomendado para ti</h2>
                    <a href="#" class="see-all">Ver todo</a>
                </div>
                <div class="cards-grid" id="recommendationsGrid">
                    <!-- Aquí se cargarán dinámicamente las canciones recomendadas -->
                    <div class="loading-cards">Cargando tu música...</div>
                </div>
            </div>

            <!-- Resultados de búsqueda (se muestran al buscar) -->
            <div id="searchResults" style="display: none;">
                <div class="section-header">
                    <h2>Resultados</h2>
                    <a href="#" id="closeResults" class="see-all">Cerrar</a>
                </div>
                <div class="cards-grid" id="resultsGrid"></div>
            </div>
        </main>

        <!-- Reproductor flotante estilo Apple Music -->
        <div class="player-bar" id="playerBar" style="display: none;">
            <div class="player-info">
                <img id="currentThumb" src="" alt="cover" width="48" height="48">
                <div class="track-details">
                    <div id="currentTitle" class="track-title">Canción</div>
                    <div class="track-artist">FamiMusic</div>
                </div>
            </div>
            <div class="player-controls">
                <button id="playPauseBtn" class="control-btn">⏸️</button>
            </div>
            <div id="youtube-player" style="position: absolute; bottom: 0; left: 0; opacity: 0; pointer-events: none;"></div>
        </div>
    </div>

    <!-- API de YouTube -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // ---------- ESTADO GLOBAL ----------
        let player;
        let currentVideoId = null;
        let isPlaying = false;
        let currentSongData = null;

        // ---------- INICIALIZAR YOUTUBE PLAYER ----------
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                playerVars: {
                    autoplay: 0,
                    controls: 0,
                    modestbranding: 1,
                    rel: 0,
                    enablejsapi: 1,
                    mute: 1   // Necesario para evitar bloqueo de autoplay
                },
                events: {
                    onReady: () => console.log("Player listo"),
                    onStateChange: onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                document.getElementById('playPauseBtn').textContent = '⏸️';
                if (player.isMuted()) showUnmuteButton();
            } else if (event.data === YT.PlayerState.PAUSED) {
                isPlaying = false;
                document.getElementById('playPauseBtn').textContent = '▶️';
            }
        }

        function showUnmuteButton() {
            let btn = document.getElementById('globalUnmute');
            if (!btn) {
                btn = document.createElement('div');
                btn.id = 'globalUnmute';
                btn.innerHTML = '🔊 Activar sonido';
                btn.style.position = 'fixed';
                btn.style.bottom = '80px';
                btn.style.right = '20px';
                btn.style.background = '#ff3b30';
                btn.style.color = 'white';
                btn.style.padding = '10px 18px';
                btn.style.borderRadius = '40px';
                btn.style.fontWeight = 'bold';
                btn.style.cursor = 'pointer';
                btn.style.zIndex = '2000';
                btn.style.boxShadow = '0 2px 12px rgba(0,0,0,0.3)';
                btn.onclick = () => {
                    player.unMute();
                    btn.remove();
                };
                document.body.appendChild(btn);
            }
        }

        // ---------- CARGAR RECOMENDACIONES (MÚSICA POPULAR) ----------
        async function loadRecommendations() {
            const grid = document.getElementById('recommendationsGrid');
            grid.innerHTML = '<div class="loading-cards">🎵 Cargando recomendaciones...</div>';
            try {
                // Buscamos música popular en varias categorías para simular "Para ti"
                const queries = ['pop hits 2025', 'relaxing acoustic', 'latin vibes', 'indie playlist'];
                const randomQuery = queries[Math.floor(Math.random() * queries.length)];
                const res = await fetch(`/search/${encodeURIComponent(randomQuery)}`);
                let songs = await res.json();
                if (!songs.length) songs = getFallbackSongs();
                renderCards(songs, 'recommendationsGrid');
            } catch (err) {
                console.error(err);
                renderCards(getFallbackSongs(), 'recommendationsGrid');
            }
        }

        function getFallbackSongs() {
            return [
                { id: "dQw4w9WgXcQ", title: "Blinding Lights", thumb: "https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg" },
                { id: "kJQP7kiw5Fk", title: "Dance Monkey", thumb: "https://img.youtube.com/vi/kJQP7kiw5Fk/hqdefault.jpg" },
                { id: "RgKAFK5djSk", title: "Levitating", thumb: "https://img.youtube.com/vi/RgKAFK5djSk/hqdefault.jpg" }
            ];
        }

        function renderCards(songs, containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';
            songs.forEach(song => {
                const card = document.createElement('div');
                card.className = 'music-card';
                card.innerHTML = `
                    <div class="card-img">
                        <img src="${song.thumb}" alt="${escapeHtml(song.title)}">
                        <button class="play-btn-overlay" data-id="${song.id}" data-title="${escapeHtml(song.title)}" data-thumb="${song.thumb}">▶</button>
                    </div>
                    <div class="card-info">
                        <div class="card-title">${escapeHtml(song.title)}</div>
                        <div class="card-sub">Artista destacado</div>
                    </div>
                `;
                container.appendChild(card);
            });
            // Asignar eventos a los botones de play
            document.querySelectorAll('.play-btn-overlay').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    const title = btn.dataset.title;
                    const thumb = btn.dataset.thumb;
                    playSong(id, title, thumb);
                });
            });
        }

        // ---------- REPRODUCIR CANCIÓN (con interacción garantizada) ----------
        async function playSong(videoId, title, thumb) {
            currentVideoId = videoId;
            currentSongData = { title, thumb };
            // Mostrar barra de reproducción
            const playerBar = document.getElementById('playerBar');
            playerBar.style.display = 'flex';
            document.getElementById('currentTitle').textContent = title;
            document.getElementById('currentThumb').src = thumb;
            
            if (player && player.loadVideoById) {
                // El usuario hizo clic → interacción válida para desbloquear audio
                player.loadVideoById({ videoId: videoId, startSeconds: 0 });
                // El player está muteado inicialmente, pero el usuario puede hacer clic en "Activar sonido"
                // Para mejorar UX, podríamos desmutear automáticamente tras el clic (pero depende del navegador)
                // Lo dejamos con el botón de activar sonido.
            } else {
                console.warn("Player no listo, reintentando...");
                setTimeout(() => playSong(videoId, title, thumb), 500);
            }
        }

        // Control de play/pause desde la barra
        document.getElementById('playPauseBtn').addEventListener('click', () => {
            if (!player || !currentVideoId) return;
            if (isPlaying) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        });

        // ---------- BÚSQUEDA ----------
        const searchInput = document.getElementById('searchInput');
        const searchResultsDiv = document.getElementById('searchResults');
        const resultsGrid = document.getElementById('resultsGrid');
        const closeResults = document.getElementById('closeResults');

        searchInput.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const query = searchInput.value.trim();
                if (!query) return;
                try {
                    const res = await fetch(`/search/${encodeURIComponent(query)}`);
                    const songs = await res.json();
                    renderCards(songs, 'resultsGrid');
                    searchResultsDiv.style.display = 'block';
                    document.getElementById('recommendations-section').style.display = 'none'; // ocultar recomendaciones mientras busca
                } catch (err) {
                    console.error(err);
                }
            }
        });

        closeResults.addEventListener('click', (e) => {
            e.preventDefault();
            searchResultsDiv.style.display = 'none';
            document.getElementById('recommendations-section').style.display = 'block';
            searchInput.value = '';
        });

        // Helper
        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Inicializar la página
        window.onload = () => {
            loadRecommendations();
        };
    </script>
</body>
</html>
