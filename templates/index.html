<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fami Music</title>
    <style>
        /* === ESTILOS Y GLASSMORPHISM === */
        :root { --text: #ffffff; --text-muted: #ebebf599; --accent: #fa233b; --tab-bg: rgba(0, 0, 0, 0.4); }
        body { margin: 0; padding: 0; color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; padding-bottom: 150px; background: #000; -webkit-font-smoothing: antialiased; }
        
        body.bloqueado { overflow: hidden; touch-action: none; }

        /* Aurora Background */
        .aurora-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; background: #000; }
        .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.5; animation: auroraAnim 15s infinite alternate ease-in-out; }
        .blob1 { width: 350px; height: 350px; background: #fa233b; top: -10%; left: -10%; }
        .blob2 { width: 450px; height: 450px; background: #5e17eb; bottom: -20%; right: -10%; animation-delay: -5s; }
        @keyframes auroraAnim { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(40px, 40px) scale(1.1); } }

        header { 
            padding: 50px 20px 15px; font-size: 34px; font-weight: 800; position: sticky; top: 0; z-index: 10; letter-spacing: 0.5px;
            background: rgba(0, 0, 0, 0.5); 
            backdrop-filter: blur(30px) saturate(200%); -webkit-backdrop-filter: blur(30px) saturate(200%);
            border-bottom: 0.5px solid rgba(255,255,255,0.1); 
        }

        .vista { display: none; }
        .vista.activa { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .seccion { margin-top: 35px; }
        .titulo-seccion { font-size: 20px; font-weight: 700; margin: 0 20px 15px; border-bottom: 0.5px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        
        /* Carrusel Base */
        .carrusel { display: flex; overflow-x: auto; padding: 0 20px; gap: 15px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
        .carrusel::-webkit-scrollbar { display: none; }
        
        /* 1. Tarjeta Normal */
        .tarjeta-normal { width: 145px; flex-shrink: 0; scroll-snap-align: start; cursor: pointer; display: flex; flex-direction: column; }
        .tarjeta-normal img { width: 145px; height: 145px; border-radius: 12px; object-fit: cover; box-shadow: 0 6px 16px rgba(0,0,0,0.4); }
        
        /* 2. Tarjeta Destacada (Estilo "Chill" Gigante) */
        .tarjeta-destacada { width: 280px; flex-shrink: 0; scroll-snap-align: start; cursor: pointer; display: flex; flex-direction: column; }
        .tarjeta-destacada img { width: 280px; height: 320px; border-radius: 16px; object-fit: cover; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        
        /* 3. Tarjeta Estación/Mix (Fondo de color y círculo) */
        .tarjeta-mix { width: 155px; flex-shrink: 0; scroll-snap-align: start; cursor: pointer; display: flex; flex-direction: column; }
        .mix-fondo { width: 155px; height: 155px; border-radius: 12px; display: flex; justify-content: center; align-items: center; box-shadow: 0 6px 16px rgba(0,0,0,0.4); }
        .mix-fondo img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.2); box-shadow: 0 8px 20px rgba(0,0,0,0.5); }

        /* Textos de tarjetas */
        .titulo-tarjeta { font-size: 15px; font-weight: 500; margin-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .artista-tarjeta { font-size: 13px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .artista-destacado { font-size: 13px; color: var(--text-muted); margin-top: 10px; }

        /* Listas Búsqueda */
        .lista-resultados { display: flex; flex-direction: column; padding: 0 20px; }
        .fila-lista { width: 100%; display: flex; flex-direction: row; align-items: center; padding: 12px 0; border-bottom: 0.5px solid rgba(255,255,255,0.08); cursor: pointer; }
        .fila-lista img { width: 55px; height: 55px; border-radius: 8px; margin-right: 15px; object-fit: cover; }
        .textos-lista { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        .mensaje-carga { padding: 20px; color: var(--text-muted); font-size: 15px; text-align: center; }

        /* === MINI REPRODUCTOR === */
        #mini-player { display: none; position: fixed; bottom: 95px; left: 15px; right: 15px; height: 64px; border-radius: 16px; align-items: center; padding: 0 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 90; cursor: pointer; border: 0.5px solid rgba(255,255,255,0.15); 
            background: rgba(30, 30, 32, 0.7); 
            backdrop-filter: blur(30px) saturate(200%); -webkit-backdrop-filter: blur(30px) saturate(200%);
        }
        #mini-img { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; margin-right: 12px; }
        .mini-info { flex: 1; overflow: hidden; }
        .mini-titulo { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-btn { background: none; border: none; color: #fff; display: flex; justify-content: center; align-items: center; cursor: pointer; padding: 5px; }

        /* === REPRODUCTOR FULL SCREEN === */
        #reproductor-ui { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: rgba(0,0,0,0.85); 
            backdrop-filter: blur(50px); -webkit-backdrop-filter: blur(50px);
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); 
            z-index: 100; padding: 40px 30px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            box-sizing: border-box; overscroll-behavior: none; 
        }
        #reproductor-ui.activo { transform: translateY(0); }
        
        .btn-cerrar { width: 40px; height: 5px; background: rgba(255,255,255,0.4); border-radius: 10px; margin-bottom: 30px; cursor: pointer; flex-shrink: 0; }
        
        .media-box { width: 100%; max-width: 320px; aspect-ratio: 1/1; border-radius: 16px; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.6); margin-bottom: 30px; position: relative; transition: transform 0.3s; flex-shrink: 0; }
        .media-box.pausado { transform: scale(0.85); } 
        
        #yt-video-container { width: 100%; height: 100%; pointer-events: none; }
        #arte-cancion { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; transition: opacity 0.3s; }
        #arte-cancion.oculto { opacity: 0; }

        .info-pista { width: 100%; max-width: 320px; margin-bottom: 20px; display: flex; flex-direction: column; align-items: flex-start; text-align: left; }
        .nombre-pista { font-size: 22px; font-weight: 700; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .nombre-artista { font-size: 18px; color: var(--accent); opacity: 0.9; margin-top: 4px; }
        
        .controles-wraper { width: 100%; max-width: 320px; }
        .tiempos { display: flex; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,0.5); font-weight: 500; }
        input[type="range"] { width: 100%; margin: 10px 0 25px; appearance: none; background: rgba(255,255,255,0.2); height: 5px; border-radius: 3px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; background: #fff; border-radius: 50%; }
        
        .controles-main { display: flex; justify-content: center; align-items: center; gap: 40px; margin-bottom: 30px; }
        .btn-icono { background: none; border: none; color: #fff; cursor: pointer; transition: opacity 0.2s; display: flex; align-items: center; justify-content: center; padding: 0; }
        .btn-icono:active { opacity: 0.5; }
        .btn-play { width: 65px; height: 65px; border-radius: 50%; background: #fff; color: #000; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s; padding: 0; }
        .btn-play:active { transform: scale(0.9); }
        
        .switch-video button { background: rgba(255,255,255,0.15); color: #fff; border: none; padding: 12px 25px; border-radius: 25px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; max-width: 320px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .switch-video button.encendido { background: var(--accent); color: white; }

        .tab-bar { 
            position: fixed; bottom: 0; left: 0; width: 100%; height: 85px; 
            background: var(--tab-bg); 
            backdrop-filter: blur(30px) saturate(200%); -webkit-backdrop-filter: blur(30px) saturate(200%);
            display: flex; justify-content: space-around; padding-top: 10px; border-top: 0.5px solid rgba(255,255,255,0.1); z-index: 80; padding-bottom: env(safe-area-inset-bottom); 
        }
        .tab { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); cursor: pointer; width: 33%; font-size: 10px; font-weight: 500; }
        .tab svg { width: 26px; height: 26px; margin-bottom: 4px; fill: currentColor; }
        .tab.activo { color: var(--accent); }

        .search-box { padding: 0 20px 10px; }
        .search-box input { width: 100%; background: rgba(255,255,255,0.15); border: none; padding: 12px 15px; border-radius: 10px; color: white; font-size: 16px; outline: none; }
        .search-box input::placeholder { color: rgba(255,255,255,0.5); }
    </style>
</head>
<body>

    <div class="aurora-bg"><div class="blob blob1"></div><div class="blob blob2"></div></div>

    <div id="vista-inicio" class="vista activa">
        <header>Escuchar</header>
        
        <div class="seccion">
            <div class="titulo-seccion">Sugerencias destacadas para ti</div>
            <div class="carrusel" id="fila-destacadas"></div>
        </div>
        
        <div class="seccion">
            <div class="titulo-seccion">Escuchado recientemente</div>
            <div class="carrusel" id="fila-recientes"></div>
        </div>
        
        <div class="seccion">
            <div class="titulo-seccion">Puro Dembow & Trap</div>
            <div class="carrusel" id="fila-dembow"></div>
        </div>
    </div>

    <div id="vista-buscar" class="vista">
        <header>Buscar</header>
        <div class="search-box">
            <input type="text" id="input-buscador" placeholder="Artistas, canciones o álbumes...">
        </div>
        <div class="lista-resultados" id="grid-buscar"><div class="mensaje-carga">Busca tus temas favoritos.</div></div>
    </div>

    <div id="vista-biblioteca" class="vista">
        <header>Biblioteca</header>
        <div class="seccion">
            <div class="titulo-seccion">Recientemente añadidos</div>
            <div class="lista-resultados" id="grid-biblioteca"></div>
        </div>
    </div>

    <div id="mini-player" onclick="abrirReproductor()">
        <img src="" id="mini-img">
        <div class="mini-info"><div class="mini-titulo" id="mini-title">...</div></div>
        <button class="mini-btn" id="mini-play-btn" onclick="alternarPlayFiltro(event)">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
    </div>

    <div id="reproductor-ui">
        <div class="btn-cerrar" onclick="cerrarReproductor()"></div>
        <div class="media-box pausado" id="media-box-anim">
            <div id="yt-video-container"></div>
            <img id="arte-cancion" src="" alt="Arte">
        </div>
        <div class="info-pista">
            <div class="nombre-pista" id="titulo-actual">Cargando...</div>
            <div class="nombre-artista" id="artista-actual">Fami Music</div>
        </div>
        <div class="controles-wraper">
            <input type="range" id="barra-progreso" value="0" min="0" max="100">
            <div class="tiempos"><span id="tiempo-actual">0:00</span><span id="tiempo-restante">-0:00</span></div>
        </div>
        <div class="controles-main">
            <button class="btn-icono" onclick="pistaAnterior()"><svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
            <button class="btn-play" id="btn-play" onclick="alternarPlay()"><svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
            <button class="btn-icono" onclick="pistaSiguiente()"><svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
        </div>
        <div class="switch-video">
            <button id="btn-toggle-video" onclick="alternarModoVideo()">Ver Video Oficial</button>
        </div>
    </div>

    <nav class="tab-bar">
        <div class="tab activo" onclick="cambiarTab('inicio', this)"><svg viewBox="0 0 24 24"><path d="M12 3L4 9v12h5v-7h6v7h5V9z"/></svg><span>Escuchar</span></div>
        <div class="tab" onclick="cambiarTab('buscar', this)"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><span>Buscar</span></div>
        <div class="tab" onclick="cambiarTab('biblioteca', this)"><svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z"/></svg><span>Biblioteca</span></div>
    </nav>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let playlistActual = [];
        let indiceActual = 0;
        let modoVideoActivo = false;
        let reproductorYT = null;
        let progresoIntervalo = null;
        let memoriasInicio = {}; 

        const elArte = document.getElementById('arte-cancion');
        const uiRep = document.getElementById('reproductor-ui');
        const btnPlay = document.getElementById('btn-play');
        const barra = document.getElementById('barra-progreso');
        const miniPlayer = document.getElementById('mini-player');
        const btnMiniPlay = document.getElementById('mini-play-btn');
        const cajaMedia = document.getElementById('media-box-anim');

        const iconPlay = `<svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
        const iconPause = `<svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
        const iconMiniPlay = `<svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
        const iconMiniPause = `<svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;

        // Colores Apple Music para los Mixes
        const gradientesApple = [
            "linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%)", 
            "linear-gradient(135deg, #ff0844 0%, #ffb199 100%)", 
            "linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)", 
            "linear-gradient(135deg, #f093fb 0%, #f5576c 100%)"
        ];

        function onYouTubeIframeAPIReady() {
            reproductorYT = new YT.Player('yt-video-container', {
                height: '100%', width: '100%', videoId: '',
                playerVars: { 'playsinline': 1, 'controls': 0, 'disablekb': 1, 'rel': 0, 'modestbranding': 1 },
                events: { 'onStateChange': cambioEstadoReproductor }
            });
        }

        function cambioEstadoReproductor(event) {
            if (event.data === YT.PlayerState.ENDED) pistaSiguiente();
            if (event.data === YT.PlayerState.PLAYING) actualizarUIPlay(true);
            if (event.data === YT.PlayerState.PAUSED) actualizarUIPlay(false);
        }

        function cambiarTab(idVista, tabApretado) {
            document.querySelectorAll('.vista').forEach(v => v.classList.remove('activa'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('activo'));
            document.getElementById('vista-' + idVista).classList.add('activa');
            tabApretado.classList.add('activo');
            if(idVista === 'biblioteca') cargarBiblioteca();
        }

        // Ya NO buscamos "mix" genéricos, buscamos hits limpios
        window.onload = () => {
            cargarFila("bad bunny exitos", "fila-destacadas", "destacada");
            cargarHistorial();
            cargarFila("el alfa dembow oficial", "fila-dembow", "normal");
        };

        function decodificarHTML(html) {
            var txt = document.createElement("textarea");
            txt.innerHTML = html;
            return txt.value.replace(/['"]/g, '').trim(); 
        }

        // Función Maestra que dibuja el diseño que pides según la fila
        function crearTarjeta(cancion, index, idContenedor, tipo) {
            let tituloRaw = cancion.title ? decodificarHTML(cancion.title) : "Desconocido";
            let artista = "Fami Music";
            let titulo = tituloRaw;
            
            if (tituloRaw.includes("-")) {
                let partes = tituloRaw.split("-");
                artista = partes[0].trim();
                titulo = partes.slice(1).join("-").trim();
            }

            // Diseño 1: Gigantes (Destacadas)
            if (tipo === 'destacada') {
                return `
                    <div class="tarjeta-destacada" onclick="iniciarPista(${index}, '${idContenedor}')">
                        <img src="${cancion.thumb}" onerror="this.src='https://ui-avatars.com/api/?name=Fami&background=1c1c1e&color=fff'">
                        <div class="artista-destacado">NUEVOS LANZAMIENTOS</div>
                        <div class="titulo-tarjeta">${titulo}</div>
                        <div class="artista-tarjeta">${artista}</div>
                    </div>
                `;
            } 
            // Diseño 2: Cuadrados de colores y foto redonda (Mix/Estaciones)
            else if (tipo === 'mix') {
                let grad = gradientesApple[index % gradientesApple.length];
                return `
                    <div class="tarjeta-mix" onclick="iniciarPista(${index}, '${idContenedor}')">
                        <div class="mix-fondo" style="background: ${grad};">
                            <img src="${cancion.thumb}" onerror="this.src='https://ui-avatars.com/api/?name=FM&background=000&color=fff'">
                        </div>
                        <div class="titulo-tarjeta">${artista} y artistas similares</div>
                        <div class="artista-tarjeta">Estación de radio</div>
                    </div>
                `;
            }
            // Diseño 3: Lista para la Búsqueda
            else if (tipo === 'lista') {
                return `
                    <div class="fila-lista" onclick="iniciarPista(${index}, '${idContenedor}')">
                        <img src="${cancion.thumb}" onerror="this.src='https://ui-avatars.com/api/?name=FM&background=1c1c1e&color=fff'">
                        <div class="textos-lista">
                            <div class="titulo-tarjeta">${titulo}</div>
                            <div class="artista-tarjeta">${artista}</div>
                        </div>
                    </div>
                `;
            } 
            // Diseño 4: Cuadrado Normal
            else {
                return `
                    <div class="tarjeta-normal" onclick="iniciarPista(${index}, '${idContenedor}')">
                        <img src="${cancion.thumb}" onerror="this.src='https://ui-avatars.com/api/?name=Fami&background=1c1c1e&color=fff'">
                        <div class="titulo-tarjeta">${titulo}</div>
                        <div class="artista-tarjeta">${artista}</div>
                    </div>
                `;
            }
        }

        async function cargarFila(busqueda, idContenedor, tipoUi) {
            const contenedor = document.getElementById(idContenedor);
            contenedor.innerHTML = '<div class="mensaje-carga">Buscando...</div>';
            try {
                const res = await fetch(`/search/${encodeURIComponent(busqueda)}`);
                const datos = await res.json();
                if (!datos || datos.length === 0) throw new Error("Vacío");
                
                memoriasInicio[idContenedor] = datos;
                contenedor.innerHTML = datos.map((c, i) => crearTarjeta(c, i, idContenedor, tipoUi)).join('');
            } catch (e) { contenedor.innerHTML = '<div class="mensaje-carga">No se pudo conectar.</div>'; }
        }

        let searchTimeout = null;
        document.getElementById('input-buscador').oninput = (e) => {
            const query = e.target.value.trim();
            if (query.length < 2) return;
            clearTimeout(searchTimeout);
            document.getElementById('grid-buscar').innerHTML = '<div class="mensaje-carga">Buscando...</div>';
            searchTimeout = setTimeout(() => { cargarFila(query, 'grid-buscar', 'lista'); }, 800);
        };

        function cargarHistorial() {
            let historial = JSON.parse(localStorage.getItem('Fami_Memoria')) || [];
            const cont = document.getElementById('fila-recientes');
            if(historial.length === 0) { cont.innerHTML = '<div class="mensaje-carga">Aún no has escuchado nada.</div>'; return; }
            
            memoriasInicio['fila-recientes'] = historial;
            // El historial ahora sale con el diseño de Estación de Radio (Mix)
            cont.innerHTML = historial.map((c, i) => crearTarjeta(c, i, 'fila-recientes', 'mix')).join('');
        }

        function cargarBiblioteca() {
            let lib = JSON.parse(localStorage.getItem('Fami_Memoria')) || [];
            const cont = document.getElementById('grid-biblioteca');
            if(lib.length === 0) { cont.innerHTML = '<div class="mensaje-carga">Tu biblioteca está vacía.</div>'; return; }
            
            memoriasInicio['grid-biblioteca'] = lib;
            cont.innerHTML = lib.map((c, i) => crearTarjeta(c, i, 'grid-biblioteca', 'lista')).join('');
        }

        function guardarEnHistorial(cancion) {
            let h = JSON.parse(localStorage.getItem('Fami_Memoria')) || [];
            h = h.filter(item => item.id !== cancion.id);
            h.unshift(cancion);
            if(h.length > 20) h.pop();
            localStorage.setItem('Fami_Memoria', JSON.stringify(h));
            cargarHistorial(); 
        }

        function anunciarDJ(cancion) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel(); 
            let msg = new SpeechSynthesisUtterance(`¡Activo! Escuchando ${cancion}`);
            msg.lang = 'es-US'; msg.rate = 1.15; msg.pitch = 1.1; 
            window.speechSynthesis.speak(msg);
        }

        function iniciarPista(indice, idContenedor) {
            if (!reproductorYT) return alert("Cargando motor...");
            playlistActual = memoriasInicio[idContenedor];
            indiceActual = indice;
            const pista = playlistActual[indiceActual];

            let tituloRaw = decodificarHTML(pista.title);
            let artista = "Fami Music";
            let titulo = tituloRaw;
            if (tituloRaw.includes("-")) {
                let partes = tituloRaw.split("-");
                artista = partes[0].trim();
                titulo = partes.slice(1).join("-").trim();
            }

            document.getElementById('titulo-actual').innerText = titulo;
            document.getElementById('artista-actual').innerText = artista;
            elArte.src = pista.thumb;
            document.getElementById('mini-title').innerText = titulo;
            document.getElementById('mini-img').src = pista.thumb;
            
            miniPlayer.style.display = 'flex'; 
            guardarEnHistorial(pista);
            anunciarDJ(titulo);

            reproductorYT.loadVideoById(pista.id);
            abrirReproductor();

            clearInterval(progresoIntervalo);
            progresoIntervalo = setInterval(actualizarBarra, 500);
        }

        function abrirReproductor() { 
            uiRep.classList.add('activo'); 
            document.body.classList.add('bloqueado'); 
        }
        function cerrarReproductor() { 
            uiRep.classList.remove('activo'); 
            document.body.classList.remove('bloqueado'); 
        }

        function alternarPlay() {
            if (!reproductorYT) return;
            reproductorYT.getPlayerState() === 1 ? reproductorYT.pauseVideo() : reproductorYT.playVideo();
        }
        function alternarPlayFiltro(e) { e.stopPropagation(); alternarPlay(); }

        function actualizarUIPlay(estaSonando) {
            if (estaSonando) {
                btnPlay.innerHTML = iconPause;
                btnMiniPlay.innerHTML = iconMiniPause;
                cajaMedia.classList.remove('pausado');
            } else {
                btnPlay.innerHTML = iconPlay;
                btnMiniPlay.innerHTML = iconMiniPlay;
                cajaMedia.classList.add('pausado'); 
            }
        }

        function alternarModoVideo() {
            modoVideoActivo = !modoVideoActivo;
            const btnV = document.getElementById('btn-toggle-video');
            if (modoVideoActivo) {
                elArte.classList.add('oculto');
                btnV.classList.add('encendido');
                btnV.innerText = "Ocultar Video";
            } else {
                elArte.classList.remove('oculto');
                btnV.classList.remove('encendido');
                btnV.innerText = "Ver Video Oficial";
            }
        }

        function pistaSiguiente() {
            memoriasInicio['playlist_actual'] = playlistActual;
            if (indiceActual < playlistActual.length - 1) iniciarPista(indiceActual + 1, 'playlist_actual');
            else iniciarPista(0, 'playlist_actual');
        }
        function pistaAnterior() {
            memoriasInicio['playlist_actual'] = playlistActual;
            if (indiceActual > 0) iniciarPista(indiceActual - 1, 'playlist_actual');
        }

        function formatoTiempo(segundos) {
            if (isNaN(segundos) || segundos < 0) return "0:00";
            let min = Math.floor(segundos / 60);
            let sec = Math.floor(segundos % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        function actualizarBarra() {
            if (!reproductorYT || !reproductorYT.getDuration) return;
            const duracion = reproductorYT.getDuration();
            const actual = reproductorYT.getCurrentTime();
            if (duracion > 0) {
                barra.max = duracion;
                barra.value = actual;
                document.getElementById('tiempo-actual').innerText = formatoTiempo(actual);
                document.getElementById('tiempo-restante').innerText = "-" + formatoTiempo(duracion - actual);
            }
        }

        barra.oninput = (e) => { if (reproductorYT) reproductorYT.seekTo(e.target.value, true); };
    </script>
</body>
</html>
