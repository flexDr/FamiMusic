<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#000000">
    <link class="pwa-icon" rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3844/3844724.png">
    <link rel="stylesheet" href="/static/style.css?v=27.0">
    <title>FamiMusic</title>
</head>
<body>
    <div id="globalAura"></div>

    <nav id="appNav" class="app-nav">
        <button class="menu-item active" onclick="switchTab('home', this)">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Inicio</span>
        </button>
        <button class="menu-item" onclick="switchTab('search', this)">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><span>Buscar</span>
        </button>
        <button class="menu-item" onclick="switchTab('library', this)">
            <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg><span>Biblioteca</span>
        </button>
    </nav>

    <div class="main-content" id="mainContent">
        <div style="padding: 50px 20px 10px 20px;">
            <h1 id="headerTitle">Inicio</h1>
            <div id="searchWrapper" style="display: none; margin-top: 15px;">
                <input type="text" id="searchBar" placeholder="Artistas, canciones, álbumes..." autocomplete="off">
            </div>
        </div>

        <div id="homeView">
            <h2 class="section-title">Para Ti</h2><div id="carousel1" class="carousel"></div>
            <h2 class="section-title">Puro Dembow</h2><div id="carousel2" class="carousel"></div>
            <h2 class="section-title">Trap Latino</h2><div id="carousel3" class="carousel"></div>
        </div>
        <div id="searchView" class="grid" style="display: none;"></div>
        <div id="libraryView" style="display: none; padding-bottom: 40px;"></div>
    </div>

    <div id="player">
        <img id="ambientBg" class="ambient-bg full-only" src="">
        <div class="dark-overlay full-only"></div>
        <div class="grabber full-only" onclick="toggleFullScreen(event)"></div>

        <div class="player-content">
            <div class="player-top" onclick="toggleFullScreen(event)">
                <div class="cover-container">
                    <img id="hudImg" src="">
                    <video id="audio1" class="media-player" playsinline webkit-playsinline></video>
                    <video id="audio2" class="media-player" playsinline webkit-playsinline></video>
                </div>

                <div class="info-texts">
                    <div id="trackName">Selecciona música</div>
                    <div id="artistName" class="full-only">FamiMusic</div>
                </div>

                <div class="mini-controls">
                    <button class="ctrl-btn" onclick="togglePlay(event)" id="btnPlayPauseMini"></button>
                    <button class="ctrl-btn" onclick="nextSong(event)">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                </div>
            </div>

            <div class="full-screen-controls full-only">
                <div class="progress-container">
                    <input type="range" id="barraProgreso" value="0" min="0" max="100">
                    <div class="time-row">
                        <span id="timeActual">0:00</span>
                        <span id="timeTotal">-0:00</span>
                    </div>
                </div>

                <div class="main-controls">
                    <button class="ctrl-btn prev-next" onclick="prevSong(event)">
                        <svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </button>
                    <button class="ctrl-btn play-big" id="btnPlayPauseBig" onclick="togglePlay(event)"></button>
                    <button class="ctrl-btn prev-next" onclick="nextSong(event)">
                        <svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                </div>

                <div class="bottom-actions">
                    <button id="btnToggleVideo" class="action-btn" onclick="toggleVideoMode(event)">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
                    </button>
                    <button id="btnInfinity" class="action-btn" onclick="toggleInfinity(event)" style="color: rgba(255,255,255,0.4);">
                        <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M18.6 6.62c-1.44 0-2.8.56-3.77 1.53L12 10.66 10.48 12h.01L7.8 14.39c-.64.64-1.49.99-2.4.99-1.87 0-3.39-1.51-3.39-3.38S3.53 8.62 5.4 8.62c.91 0 1.76.35 2.44 1.03l1.13 1 1.51-1.34L9.22 8.2C8.2 7.18 6.84 6.62 5.4 6.62 2.42 6.62 0 9.04 0 12s2.42 5.38 5.4 5.38c1.44 0 2.8-.56 3.77-1.53l2.83-2.5.01.01L13.52 12h-.01l2.69-2.39c.64-.64 1.49-.99 2.4-.99 1.87 0 3.39 1.51 3.39 3.38s-1.52 3.38-3.39 3.38c-.9 0-1.76-.35-2.44-1.03l-1.14-1.01-1.51 1.34 1.27 1.12c1.02 1.01 2.37 1.57 3.82 1.57 2.98 0 5.4-2.41 5.4-5.38s-2.42-5.38-5.4-5.38z"/></svg>
                    </button>
                    <button id="btnDownload" class="action-btn" onclick="descargarCancion(event)">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                    </button>
                </div>
            </div>
        </div>
        <div id="miniProgress"></div>
    </div>

    <script src="/static/app.js?v=27.0"></script>
</body>
</html>
